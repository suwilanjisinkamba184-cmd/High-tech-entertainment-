name: high_tech_entertainment
description: Official High-Tech Entertainment native app.
publish_to: 'none'
version: 2.0.1+5

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.10.0
  http: ^1.6.0
  package_info_plus: ^8.3.1
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.17
  video_player: ^2.10.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/high-tech-logo.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/high-tech-logo.png
  min_sdk_android: 26
