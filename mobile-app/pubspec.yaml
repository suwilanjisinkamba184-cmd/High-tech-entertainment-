name: high_tech_entertainment
description: Official High-Tech Entertainment native app with startup audio recovery and enhanced startup experience.
publish_to: 'none'
version: 2.2.10+27

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.10.0
  http: ^1.6.0
  package_info_plus: ^8.3.1
  audio_session: ^0.2.4
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  video_player: ^2.14.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  crypto: ^3.0.6
  google_sign_in: ^7.2.0
  shorebird_code_push: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/high-tech-startup.mp3
    - assets/AUD-20261103-WA0002.mp3
    - assets/high-tech-logo.svg
    - shorebird.yaml

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/high-tech-logo.png
  min_sdk_android: 26
