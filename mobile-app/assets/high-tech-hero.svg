<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">High-Tech Entertainment — Quality Sound, Global Vibes</title>
<desc id="desc">Original cinematic black, metallic gold and silver sound artwork with a headphone-wearing performer silhouette, studio microphone, luminous audio rings and equalizer bars.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08090b"/><stop offset=".52" stop-color="#15130f"/><stop offset="1" stop-color="#050607"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#d7a84c" stop-opacity=".34"/><stop offset=".5" stop-color="#a87527" stop-opacity=".12"/><stop offset="1" stop-color="#08090b" stop-opacity="0"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1bd"/><stop offset=".28" stop-color="#e9c16c"/><stop offset=".62" stop-color="#98631d"/><stop offset="1" stop-color="#f4d98f"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f5f0"/><stop offset=".5" stop-color="#8d969d"/><stop offset="1" stop-color="#30383d"/></linearGradient>
 <linearGradient id="silhouette" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34383a"/><stop offset=".48" stop-color="#111518"/><stop offset="1" stop-color="#050607"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#d7b66c" stroke-opacity=".08" stroke-width="1"/></pattern>
</defs>
