name: high_tech_ui
description: Flutter presentation module for High-Tech Entertainment Android 3.1.
publish_to: 'none'
version: 3.1.0+30
environment:
  sdk: '>=3.13.0 <4.0.0'

module:
  androidX: true
  androidPackage: com.hightechentertainment.flutterui
  iosBundleIdentifier: com.hightechentertainment.flutterui

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/high-tech-logo.svg
