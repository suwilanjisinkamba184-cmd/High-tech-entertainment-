<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">HTE — High-Tech Entertainment</title>
<desc id="desc">A custom HTE monogram in dimensional metallic gold and silver, framed by illuminated concentric rings on a deep black field.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4c8"/><stop offset=".2" stop-color="#f2ca68"/><stop offset=".48" stop-color="#a86c18"/><stop offset=".7" stop-color="#ffe7a0"/><stop offset="1" stop-color="#87500d"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2=".9" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".28" stop-color="#c9ced2"/><stop offset=".55" stop-color="#777f86"/><stop offset=".78" stop-color="#eef0ed"/><stop offset="1" stop-color="#858c92"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2=".2" y2="1"><stop offset="0" stop-color="#fff4c9"/><stop offset=".22" stop-color="#f5c65b"/><stop offset=".58" stop-color="#bd7b19"/><stop offset="1" stop-color="#ffe39a"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/><feOffset dy="11" result="o"/><feComponentTransfer><feFuncA type="linear" slope=".7"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1024" height="1024" rx="148" fill="#050607"/>
<circle cx="512" cy="512" r="430" fill="none" stroke="#9d681d" stroke-width="25" opacity=".45" filter="url(#glow)"/>
<circle cx="512" cy="512" r="430" fill="none" stroke="url(#gold)" stroke-width="17"/>
<circle cx="512" cy="512" r="397" fill="none" stroke="url(#silver)" stroke-width="3" opacity=".72"/>
<circle cx="512" cy="512" r="365" fill="none" stroke="#d7ad5a" stroke-width="2" opacity=".22"/>
<g filter="url(#shadow)" fill="url(#face)" stroke="#82500e" stroke-width="5" stroke-linejoin="bevel">
 <path d="M132 332h82v135h122V332h82v360h-82V544H214v148h-82z"/>
 <path d="M414 332h238v78h-78v282h-82V410h-78z"/>
 <path d="M690 332h202v74H772v66h108v73H772v73h120v74H690z"/>
</g>
<path d="M140 338h66v7h-66zM422 338h222v7H422zM698 338h185v7H698z" fill="#fff3c5" opacity=".72"/>
<path d="M132 730h760" stroke="url(#silver)" stroke-width="2" opacity=".42"/>
<text x="512" y="790" text-anchor="middle" fill="url(#silver)" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="12">HIGH-TECH ENTERTAINMENT</text>
</svg>