version: 2
updates:
  - package-ecosystem: gradle
    directory: /hte-universe-native
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Lusaka
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - android
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Africa/Lusaka
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
