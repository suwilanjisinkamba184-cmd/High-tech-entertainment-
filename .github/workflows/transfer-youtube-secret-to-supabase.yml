name: Transfer YouTube API key to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hte-youtube-secret-transfer
  cancel-in-progress: false

jobs:
  transfer:
    name: Securely configure Supabase Edge Function secret
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate required secrets
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$YOUTUBE_API_KEY" ]]; then
            echo "::error::GitHub Actions secret YOUTUBE_API_KEY is missing."
            exit 1
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN to GitHub Actions repository secrets, then rerun this workflow."
            exit 1
          fi
          echo "Required credentials are present. Secret values will not be printed."

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Set YouTube API key in Supabase
        shell: bash
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase secrets set --project-ref wqrxacjbsldbnoekbkbf "YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
          echo "Supabase accepted the YOUTUBE_API_KEY secret."

      - name: Verify secret name is configured
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          supabase secrets list --project-ref wqrxacjbsldbnoekbkbf
          echo "Verification completed. The secret value was not requested or printed."
