name: Publish High-Tech Entertainment website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble public website
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R assets admin account _site/
          cp index.html supabase-config.js robots.txt sitemap.xml account-deletion.html privacy-policy.html high-tech-logo.svg _site/
          cp google31fdb4754075f7bd.html googled2aa97c2eb951371.html _site/ 2>/dev/null || true
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/privacy-policy.html
          test -s _site/account-deletion.html
          test -s _site/supabase-config.js
          test -s _site/assets/premium-refresh.css
          test -s _site/assets/admin-enhancements.css
          test -s _site/assets/admin-enhancements.js
          test -s _site/admin/index.html
          node --check _site/assets/admin-enhancements.js
          test -s _site/account/index.html
          python -m json.tool package.json >/dev/null
          python -c "import xml.etree.ElementTree as ET; ET.parse('_site/sitemap.xml')"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
