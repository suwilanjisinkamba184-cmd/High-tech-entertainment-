name: Validate High-Tech Entertainment website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hte-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: website/package.json
      - name: Validate Astro website and retained platform routes
        run: |
          set -euo pipefail
          test -s website/package.json
          test -s website/astro.config.mjs
          test -s website/src/pages/index.astro
          test -s website/public/images/brand/high-tech-hero.svg
          grep -q 'hero-photo' website/src/pages/index.astro
          python -c "import xml.etree.ElementTree as ET; ET.parse('website/public/images/brand/high-tech-hero.svg')"
          test -s website/src/components/PublicCatalogue.tsx
          test -s website/src/components/ServiceLanding.astro
          test -s website/src/data/public-seo.json
          test -s website/src/pages/services/index.astro
          test -s website/src/pages/services/music-production.astro
          test -s website/src/pages/services/mixing-mastering.astro
          test -s website/src/pages/services/artist-promotion.astro
          test -s website/src/pages/services/software-development.astro
          test -s website/src/pages/journal/index.astro
          test -s website/src/pages/journal/prepare-for-a-recording-session.astro
          test -s website/src/pages/journal/from-beat-to-release.astro
          test -s website/src/pages/artists/'[id]-[slug].astro'
          test -s website/src/pages/releases/'[id]-[slug].astro'
          test -s scripts/generate-public-seo-data.mjs
          test -s scripts/generate-public-sitemap.mjs
          grep -q 'canonical = ' website/src/layouts/SiteLayout.astro
          grep -q 'twitter:image' website/src/layouts/SiteLayout.astro
          grep -q 'generate-public-seo-data.mjs' scripts/build-website.sh
          grep -q 'generate-public-sitemap.mjs' scripts/build-website.sh
          test -s supabase-config.js
          test -s robots.txt
          test -s sitemap.xml
          test -s assets/app.js
          test -s assets/site.css
          test -s assets/videos.js
          test -s assets/hte-player.js
          test -s assets/hte-player.css
          test -s assets/hte-universe-full-ui.css
          test -s assets/founder-studio-full-ui.css
          test -s assets/account-full-ui.css
          test -s assets/founder-media-preview.js
          test -s assets/founder-studio-operations.js
          test -s assets/founder-studio-operations.css
          grep -q 'assets/founder-studio-operations.js' admin/index.html
          grep -q 'assets/founder-studio-operations.css' admin/index.html
          grep -q 'URL.createObjectURL(file)' assets/founder-media-preview.js
          grep -q "parsedUrl.protocol!=='blob:'" assets/founder-media-preview.js
          grep -q "document.createElement('audio')" assets/founder-media-preview.js
          grep -q "document.createElement('video')" assets/founder-media-preview.js
          grep -q 'application/octet-stream' assets/founder-media-preview.js
          grep -q 'video/mp4' assets/founder-media-preview.js
          grep -q '!audio.paused && !audio.ended' assets/hte-player.js
          grep -q 'grid-template-areas:"toggle info close" "progress progress progress"' assets/hte-universe-full-ui.css
          grep -q 'assets/hte-player.js' website/src/layouts/SiteLayout.astro
          grep -q 'assets/hte-player.js' account/index.html
          grep -q 'assets/founder-media-preview.js' admin/index.html
          grep -q 'id="hte-search-input"' website/src/pages/index.astro
          test -s website/src/pages/videos/index.astro
          grep -q 'id="video-search-input"' website/src/pages/videos/index.astro
          grep -q 'data-video-source-filter="hte"' website/src/pages/videos/index.astro
          grep -q 'assets/videos.js?v=11' website/src/pages/videos/index.astro
          grep -q 'Browse all videos' website/src/pages/index.astro
          grep -q 'href={base + "videos/"}' website/src/pages/index.astro
          grep -q 'data-video-source' assets/videos.js
          grep -q 'aria-label="Play video:' assets/videos.js
          grep -q 'youtu\.be' assets/videos.js
          grep -q 'display:grid;grid-template-columns' website/src/pages/videos/index.astro
          grep -q "siteBasePath=window.location.pathname.startsWith('/High-tech-entertainment-/')" assets/videos.js
          grep -q "el.dataset.hteVideoLoaded='true'" assets/videos.js
          grep -q 'aria-live' assets/admin-upload.js
          grep -q 'aria-live' assets/admin-video.js
          grep -q 'hte-channel-fieldset' admin/index.html
          node --check assets/app.js
          node --check assets/videos.js
          test -s assets/booking-confirmation.aac
          grep -q 'booking-confirmation.mp3' assets/app.js
          grep -q 'booking-confirmation.mp3' scripts/build-website.sh
          test -s account/index.html
          grep -q '<div id="account-login" class="account-login-card">' account/index.html
          grep -q 'Supabase could not initialise in this browser' assets/app.js
          grep -q 'auth.signUp' assets/app.js
          grep -q 'resetPasswordForEmail' assets/app.js
          grep -q 'auth.updateUser' assets/app.js
          grep -q '@2.119.0' account/index.html
          grep -q 'DEFAULT_COVER' website/src/components/PublicCatalogue.tsx
          grep -q 'high-tech-hero.svg' assets/app.js
          grep -Fq '/\.(mp4' website/src/components/PublicCatalogue.tsx
          grep -q 'AudioPlayer' website/src/components/PublicCatalogue.tsx
          grep -q 'hte-video-controls' website/src/components/PublicCatalogue.tsx
          grep -q 'id="booking-form"' account/index.html
          grep -q 'id="account-downloads"' account/index.html
          grep -q 'id="auth-mode-toggle"' account/index.html
          grep -q 'id="forgot-password"' account/index.html
          grep -q 'id="password-update-form"' account/index.html
          grep -Eq 'assets/app.js\?v=[0-9]+' account/index.html
          grep -q 'onAuthStateChange' assets/app.js
          grep -q "rpc('hte_is_admin')" assets/app.js
          grep -q 'HTE_SUPABASE_CLIENT' assets/app.js
          grep -q 'window.HTE_SUPABASE_CLIENT' assets/admin-upload.js
          grep -q "client.rpc('hte_is_admin')" assets/admin-upload.js
          grep -q 'async function profileLoad' assets/app.js
          grep -q 'profiles.*insert' assets/app.js
          grep -Eq 'assets/app.js\?v=[0-9]+' website/src/pages/index.astro
          grep -Eq 'assets/videos.js\?v=[0-9]+' website/src/pages/index.astro
          grep -q 'The music catalogue is taking too long to respond' assets/app.js
          grep -Fq "\$\$('[data-start-form],#contact-form,#booking-form,#feedback-form')" assets/app.js
          grep -q 'function withTimeout(promise,ms,message)' assets/app.js
          grep -q 'HTE video catalogue request timed out after 12 seconds' assets/videos.js
          grep -q 'entertainment-enhancements.css' account/index.html
          grep -q 'id="primary-navigation"' website/src/pages/index.astro
          grep -q 'class="menu-toggle"' website/src/pages/index.astro
          grep -Eq 'assets/app.js\?v=[0-9]+' admin/index.html
          grep -Eq 'assets/admin-upload.js\?v=[0-9]+' admin/index.html
          grep -q 'authNext' website/src/pages/index.astro
          grep -q 'callbackParams.delete' website/src/pages/index.astro
          grep -q 'loadAccountDownloads' assets/app.js
          grep -q "const base = import.meta.env.BASE_URL.replace" website/src/pages/download.astro
          grep -q 'source_url,source_platform,rights_status,download_allowed,branded_audio_url,download_branding_status' website/src/components/PublicCatalogue.tsx
          grep -q 'The catalogue request took too long' website/src/components/PublicCatalogue.tsx
          grep -q 'withTimeout(db.from(' website/src/components/PublicCatalogue.tsx
          grep -q 'function logDiagnostic(label,error){if(founderAccess)' assets/app.js
          grep -q 'HTE catalogue section unavailable:' website/src/components/PublicCatalogue.tsx
          ! grep -Fq "console.error('HTE catalogue '" website/src/components/PublicCatalogue.tsx
          grep -q 'Download audio' website/src/components/PublicCatalogue.tsx
          grep -q 'is_root_reference = target.startswith("/")' scripts/build-website.sh
          ! grep -Fq 'href={downloadUrl || src}' website/src/components/PublicCatalogue.tsx
          test -s admin/index.html
          grep -q 'id="artists"' website/src/components/PublicCatalogue.tsx
          grep -q "from('artists')" website/src/components/PublicCatalogue.tsx
          grep -Fq "target[0]!=='artists'" assets/app.js
          grep -q "from('tracks')" website/src/components/PublicCatalogue.tsx
          grep -q "from('releases')" website/src/components/PublicCatalogue.tsx
          grep -q "from('videos')" website/src/components/PublicCatalogue.tsx
          grep -q "siteBasePath=()=>location.pathname.startsWith('/High-tech-entertainment-/')" assets/app.js
          ! grep -R -n '2\.2\.10' website/src
          python -m json.tool package.json >/dev/null
          python -m json.tool website/package.json >/dev/null
      - name: Validate Founder Studio form label relationships
        run: |
          python - <<'PY'
          import re
          html = open('admin/index.html', encoding='utf-8').read()
          ids = [a or b for a,b in re.findall(r"\bid=(?:\"([^\"]+)\"|'([^']+)')", html)]
          if len(ids) != len(set(ids)):
              raise SystemExit('Founder Studio contains duplicate control IDs')
          id_set = set(ids)
          refs = [a or b for a,b in re.findall(r"<label\b[^>]*\bfor=(?:\"([^\"]+)\"|'([^']+)')", html, re.I)]
          missing = [ref for ref in refs if ref not in id_set]
          if missing:
              raise SystemExit('Founder Studio labels reference missing controls: ' + ', '.join(missing))
          labels = re.findall(r'<label\b([^>]*)>([\s\S]*?)</label>', html, re.I)
          wrapped = [attrs for attrs, body in labels if re.search(r'<input\b', body, re.I)]
          if any(re.search(r'\bfor=', attrs, re.I) for attrs in wrapped):
              raise SystemExit('A wrapping checkbox label must not point to a different control')
          unassociated = [attrs for attrs, body in labels if not re.search(r'\bfor=', attrs, re.I)]
          if len(unassociated) != len(wrapped):
              raise SystemExit('Every unassociated Founder Studio label must wrap its control')
          if '<fieldset class="field full hte-channel-fieldset"><legend>Target channels</legend>' not in html:
              raise SystemExit('Campaign channel options need a semantic fieldset/legend')
          print(f'Founder Studio labels valid: {len(refs)} explicit, {len(wrapped)} implicit, {len(ids)} unique IDs')
          PY
      - name: Check legacy JavaScript syntax
        run: find assets admin account -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Validate sitemap XML
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('Sitemap XML is valid')"
          node --check scripts/generate-public-seo-data.mjs
          node --check scripts/generate-public-sitemap.mjs
          grep -q '/services/music-production/' sitemap.xml
          grep -q '/journal/prepare-for-a-recording-session/' sitemap.xml
      - name: Build Astro + React website and validate shared routes
        run: bash scripts/build-website.sh
