name: Validate High-Tech Entertainment website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hte-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate required website files
        run: |
          test -s index.html
          test -s supabase-config.js
          test -s robots.txt
          test -s sitemap.xml
          test -s assets/app.js
          test -s assets/site.css
          test -s assets/videos.js
          test -s assets/streaming.js
          test -s account/index.html
          test -s admin/index.html
          grep -q 'https://high-tech-entertainment.suwilanjisinkamba184.workers.dev' index.html
          grep -q '<link rel="canonical"' index.html
          grep -q 'https://high-tech-entertainment.suwilanjisinkamba184.workers.dev/sitemap.xml' robots.txt
          python -m json.tool package.json > /dev/null
      - name: Check JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('Sitemap XML is valid')"
      - name: Check JavaScript syntax
        run: |
          find assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
