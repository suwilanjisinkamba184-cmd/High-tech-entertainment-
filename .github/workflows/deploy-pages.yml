name: Validate High-Tech Entertainment website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hte-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package.json
      - name: Validate Astro website and retained platform routes
        run: |
          set -euo pipefail
          test -s website/package.json
          test -s website/astro.config.mjs
          test -s website/src/pages/index.astro
          test -s website/src/components/PublicCatalogue.tsx
          test -s supabase-config.js
          test -s robots.txt
          test -s sitemap.xml
          test -s assets/app.js
          test -s assets/site.css
          test -s assets/videos.js
          test -s assets/booking-confirmation.aac
          test -s account/index.html
          test -s admin/index.html
          grep -q 'id="artists"' website/src/pages/index.astro
          grep -q "from('artists')" website/src/components/PublicCatalogue.tsx
          grep -q "from('tracks')" website/src/components/PublicCatalogue.tsx
          grep -q "from('releases')" website/src/components/PublicCatalogue.tsx
          grep -q "from('videos')" website/src/components/PublicCatalogue.tsx
          grep -q "siteBasePath=()=>location.pathname.startsWith('/High-tech-entertainment-/')" assets/app.js
          ! grep -R -n '2\.2\.10' website/src
          python -m json.tool package.json >/dev/null
          python -m json.tool website/package.json >/dev/null
      - name: Check legacy JavaScript syntax
        run: find assets admin account -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('Sitemap XML is valid')"
      - name: Build Astro + React website and validate shared routes
        run: bash scripts/build-website.sh
