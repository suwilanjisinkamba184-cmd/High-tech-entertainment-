name: Validate High-Tech Entertainment website
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hte-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package.json
      - name: Validate Astro website and retained platform routes
        run: |
          set -euo pipefail
          test -s website/package.json
          test -s website/astro.config.mjs
          test -s website/src/pages/index.astro
          test -s website/public/images/brand/high-tech-hero.svg
          test -s mobile-app/assets/high-tech-hero.svg
          grep -q 'images/brand/high-tech-hero.svg' website/src/pages/index.astro
          grep -q 'assets/high-tech-hero.svg' mobile-app/pubspec.yaml
          grep -q 'assets/high-tech-hero.svg' mobile-app/lib/main.dart
          python -c "import xml.etree.ElementTree as ET; ET.parse('website/public/images/brand/high-tech-hero.svg'); ET.parse('mobile-app/assets/high-tech-hero.svg')"
          test -s website/src/components/PublicCatalogue.tsx
          test -s supabase-config.js
          test -s robots.txt
          test -s sitemap.xml
          test -s assets/app.js
          test -s assets/site.css
          test -s assets/videos.js
          test -s assets/booking-confirmation.aac
          test -s account/index.html
          grep -q '<div id="account-login" class="account-login-card">' account/index.html
          grep -q 'Supabase could not initialise in this browser' assets/app.js
          grep -q 'auth.signUp' assets/app.js
          grep -q 'resetPasswordForEmail' assets/app.js
          grep -q 'auth.updateUser' assets/app.js
          grep -q '@2.119.0' account/index.html
          grep -q 'DEFAULT_COVER' website/src/components/PublicCatalogue.tsx
          grep -q 'high-tech-hero.svg' assets/app.js
          grep -Fq '/\.(mp4' website/src/components/PublicCatalogue.tsx
          grep -q 'AudioPlayer' website/src/components/PublicCatalogue.tsx
          grep -q 'hte-video-controls' website/src/components/PublicCatalogue.tsx
          grep -q 'id="booking-form"' account/index.html
          grep -q 'id="account-downloads"' account/index.html
          grep -q 'id="auth-mode-toggle"' account/index.html
          grep -q 'id="forgot-password"' account/index.html
          grep -q 'id="password-update-form"' account/index.html
          grep -q 'assets/app.js?v=11' account/index.html
          grep -q 'assets/app.js?v=11' admin/index.html
          grep -q 'authNext' website/src/pages/index.astro
          grep -q 'callbackParams.delete' website/src/pages/index.astro
          grep -q 'loadAccountDownloads' assets/app.js
          test -s admin/index.html
          grep -q 'id="artists"' website/src/components/PublicCatalogue.tsx
          grep -q "from('artists')" website/src/components/PublicCatalogue.tsx
          grep -q "from('tracks')" website/src/components/PublicCatalogue.tsx
          grep -q "from('releases')" website/src/components/PublicCatalogue.tsx
          grep -q "from('videos')" website/src/components/PublicCatalogue.tsx
          grep -q "siteBasePath=()=>location.pathname.startsWith('/High-tech-entertainment-/')" assets/app.js
          ! grep -R -n '2\.2\.10' website/src
          python -m json.tool package.json >/dev/null
          python -m json.tool website/package.json >/dev/null
      - name: Check legacy JavaScript syntax
        run: find assets admin account -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
      - name: Validate sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('sitemap.xml'); print('Sitemap XML is valid')"
      - name: Build Astro + React website and validate shared routes
        run: bash scripts/build-website.sh
