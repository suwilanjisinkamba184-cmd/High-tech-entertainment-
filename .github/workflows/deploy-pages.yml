name: Deploy High-Tech Entertainment website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare complete static website
        run: |
          mkdir -p _site
          cp index.html supabase-config.js robots.txt sitemap.xml _site/
          cp googled2aa97c2eb951371.html _site/
          if [ -f google31fdb4754075f7bd.html ]; then cp google31fdb4754075f7bd.html _site/; fi
          test -s _site/index.html
          test -s _site/robots.txt
          test -s _site/sitemap.xml
          test -s _site/supabase-config.js
          test -s _site/assets/app.js
          test -s _site/assets/site.css
          test -s _site/admin/index.html
          test -s _site/account/index.html
          python -c "import xml.etree.ElementTree as ET; ET.parse('_site/sitemap.xml'); print('Sitemap XML is valid')"
          cp -R assets admin account _site/
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
