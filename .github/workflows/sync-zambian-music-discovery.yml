name: Discover and publish new Zambian YouTube music

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/zambian-youtube.json'
      - 'supabase/functions/sync-zambian-music/**'
      - 'supabase/config.toml'
      - '.github/workflows/sync-zambian-music-discovery.yml'
  push:
    branches: [main, 'fix/zambian-youtube-edge-sync']
    paths:
      - 'config/zambian-youtube.json'
      - 'scripts/youtube_zambian_sync.py'
      - 'supabase/functions/sync-zambian-music/**'
      - 'supabase/config.toml'
      - '.github/workflows/sync-zambian-music-discovery.yml'

permissions:
  contents: read

concurrency:
  group: hte-zambian-music-discovery
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate discovery configuration and Edge Function
        run: |
          python -m json.tool config/zambian-youtube.json > /dev/null
          deno check --config supabase/functions/sync-zambian-music/deno.json supabase/functions/sync-zambian-music/index.ts

  discover:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check Supabase Management API credential
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Zambian music discovery is skipped. Configure the existing SUPABASE_ACCESS_TOKEN repository secret."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Invoke Supabase server-side discovery
        if: ${{ steps.credentials.outputs.enabled == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const siteConfig = readFileSync('supabase-config.js', 'utf8');
          const url = siteConfig.match(/url:\s*'([^']+)'/)?.[1];
          const publishableKey = siteConfig.match(/publishableKey:\s*'([^']+)'/)?.[1];
          const discovery = JSON.parse(readFileSync('config/zambian-youtube.json', 'utf8'));
          if (!url || !publishableKey) throw new Error('Public Supabase configuration could not be read.');

          const response = await fetch(url.replace(/\/$/, '') + '/functions/v1/sync-zambian-music', {
            method: 'POST',
            headers: {
              apikey: publishableKey,
              Authorization: 'Bearer ' + publishableKey,
              'x-supabase-access-token': process.env.SUPABASE_ACCESS_TOKEN,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              action: 'sync',
              channels: discovery.channels,
              lookback_days: discovery.lookback_days,
              max_posts_per_run: discovery.max_posts_per_run,
              min_duration_seconds: discovery.min_duration_seconds,
              max_duration_seconds: discovery.max_duration_seconds
            })
          });
          const result = await response.json();
          if (!response.ok || result.success !== true) {
            throw new Error(result.error || 'Zambian music sync failed with HTTP ' + response.status);
          }
          console.log(JSON.stringify({
            imported: result.imported,
            duplicates: result.skippedDuplicates,
            channels: result.scannedChannels,
            titles: result.titles
          }, null, 2));
          NODE
