name: Deploy official website to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build shared public website
        run: bash scripts/build-website.sh

      - name: Check Cloudflare deployment credentials
        id: cloudflare-auth
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: d77a2c2a7174f25006b15b57090fada0
        run: |
          if [[ -n "$CF_API_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment is skipped until CLOUDFLARE_API_TOKEN is added to repository Actions secrets."
          fi

      - name: Deploy website to Cloudflare Pages
        if: steps.cloudflare-auth.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d77a2c2a7174f25006b15b57090fada0
          command: pages deploy dist --project-name=high-tech-entertainment --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
