name: Native Android validation

on:
  push:
    branches:
      - migration/native-android-kotlin-3.0-foundation
  pull_request:
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native-android
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8"

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: hte-native-android-debug
          path: native-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
