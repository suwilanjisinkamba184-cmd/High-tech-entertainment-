name: Sync official HTE YouTube channel

on:
  push:
    branches:
      - feature/shared-youtube-video-catalogue
    paths:
      - .github/workflows/sync-official-youtube-channel.yml
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hte-official-youtube-channel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate sync configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HTE_YOUTUBE_CHANNEL_ID: ${{ vars.HTE_YOUTUBE_CHANNEL_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          test -n "$HTE_YOUTUBE_CHANNEL_ID" || { echo "::error::HTE_YOUTUBE_CHANNEL_ID variable is missing"; exit 1; }
          echo "Sync configuration is present."

      - name: Sync latest public uploads into the shared HTE catalogue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HTE_YOUTUBE_CHANNEL_ID: ${{ vars.HTE_YOUTUBE_CHANNEL_ID }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --request POST "$SUPABASE_URL/functions/v1/sync-youtube-channel" \
            --header "Content-Type: application/json" \
            --header "x-supabase-access-token: $SUPABASE_ACCESS_TOKEN" \
            --data "$(jq -n --arg channel "$HTE_YOUTUBE_CHANNEL_ID" '{channel: $channel, maxPages: 2}')")"
          echo "$response" | jq .
          echo "$response" | jq -e '.ok == true' >/dev/null || {
            echo "::error::Supabase channel sync did not return ok=true"
            exit 1
          }
          echo "Official HTE YouTube channel sync completed."
