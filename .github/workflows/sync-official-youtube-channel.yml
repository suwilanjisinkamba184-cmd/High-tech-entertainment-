name: Sync official and approved HTE artist YouTube channels

on:
  push:
    branches:
      - feature/shared-youtube-video-catalogue
    paths:
      - .github/workflows/sync-official-youtube-channel.yml
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hte-youtube-channel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate sync configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HTE_YOUTUBE_CHANNEL_ID: ${{ vars.HTE_YOUTUBE_CHANNEL_ID }}
          HTE_ARTIST_CHANNEL_IDS: ${{ vars.HTE_ARTIST_CHANNEL_IDS }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is missing"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }
          test -n "$HTE_YOUTUBE_CHANNEL_ID" || { echo "::error::HTE_YOUTUBE_CHANNEL_ID variable is missing"; exit 1; }
          test -n "$HTE_ARTIST_CHANNEL_IDS" || { echo "::error::HTE_ARTIST_CHANNEL_IDS variable is missing"; exit 1; }
          echo "Sync configuration is present."

      - name: Sync official and approved artist uploads into shared HTE catalogue
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          HTE_YOUTUBE_CHANNEL_ID: ${{ vars.HTE_YOUTUBE_CHANNEL_ID }}
          HTE_ARTIST_CHANNEL_IDS: ${{ vars.HTE_ARTIST_CHANNEL_IDS }}
        run: |
          set -euo pipefail
          sync_channel() {
            local channel_id="$1"
            echo "Syncing YouTube channel: $channel_id"
            response="$(curl --fail-with-body --silent --show-error \
              --request POST "$SUPABASE_URL/functions/v1/sync-youtube-channel" \
              --header "Content-Type: application/json" \
              --header "x-supabase-access-token: $SUPABASE_ACCESS_TOKEN" \
              --data "$(jq -n --arg channel "$channel_id" '{channel: $channel, maxPages: 2}')")"
            echo "$response" | jq .
            echo "$response" | jq -e '.ok == true' >/dev/null || {
              echo "::error::Supabase channel sync failed for $channel_id"
              exit 1
            }
          }
          sync_channel "$HTE_YOUTUBE_CHANNEL_ID"
          IFS=',' read -ra artist_channels <<< "$HTE_ARTIST_CHANNEL_IDS"
          for channel_id in "${artist_channels[@]}"; do
            channel_id="$(echo "$channel_id" | xargs)"
            test -n "$channel_id" || continue
            sync_channel "$channel_id"
          done
          echo "All configured YouTube channel syncs completed successfully."
