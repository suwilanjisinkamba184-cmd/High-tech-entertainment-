name: High-Tech Entertainment - Live Android Preview

on:
  workflow_run:
    workflows:
      - High-Tech Entertainment - Android Release & OTA
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful GitHub Actions run ID containing the Android APK artifact"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  upload-to-appetize:
    name: Publish Android build to Appetize
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact from completed Android build
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id || github.event.workflow_run.id }}
          path: appetize-artifacts
          merge-multiple: true

      - name: Locate signed Android APK
        id: apk
        shell: bash
        run: |
          APK="$(find appetize-artifacts -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::No APK was found in the selected workflow run's artifacts."
            find appetize-artifacts -maxdepth 4 -type f -print || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Selected APK: $APK"

      - name: Upload Android APK to Appetize
        id: appetize
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: zx6aumhthcok64vx3yoc3udqqm
          appFile: ${{ steps.apk.outputs.path }}
          platform: android
          fileType: apk
          note: "High-Tech Entertainment preview from workflow run ${{ inputs.source_run_id || github.event.workflow_run.id }}"

      - name: Publish simulator link in workflow summary
        shell: bash
        env:
          APPETIZE_PUBLIC_KEY: ${{ steps.appetize.outputs.publicKey }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
        run: |
          {
            echo "## High-Tech Entertainment - Live Android Preview"
            echo
            echo "**Simulator:** https://appetize.io/app/$APPETIZE_PUBLIC_KEY"
            echo
            echo "**Source workflow run:** $SOURCE_RUN_ID"
            echo
            echo "Open the simulator link in Chrome to test the Android app."
          } >> "$GITHUB_STEP_SUMMARY"
