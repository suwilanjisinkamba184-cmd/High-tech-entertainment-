name: Deploy HTE YouTube sync Edge Function

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/sync-youtube-channel/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-youtube-function.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy Edge Function without platform JWT gate (function validates project access token)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sync-youtube-channel --project-ref wqrxacjbsldbnoekbkbf --no-verify-jwt
