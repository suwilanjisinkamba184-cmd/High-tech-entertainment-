name: HTE Universe — clean Compose rebuild

on:
  push:
    branches: [main, rebuild/hte-universe-compose-clean]
    tags: ['native-v*']
  pull_request:
    branches: [main, rebuild/hte-universe-compose-clean]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hte-universe-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hte-universe-native
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          # Android Gradle Plugin resolves compileSdk 37 as android-37 while the
          # preview SDK Manager package is installed under android-37.0.
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -d "$ANDROID_HOME/platforms/android-37"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Validate Supabase runtime configuration
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL secret is required"; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::SUPABASE_PUBLISHABLE_KEY secret is required"; exit 1; }
          case "$SUPABASE_URL" in
            https://*) ;;
            *) echo "::error::SUPABASE_URL must use HTTPS"; exit 1 ;;
          esac
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run Android lint for debug and release
        run: |
          set +e
          gradle --no-daemon :app:lintDebug :app:lintRelease --console=plain
          lint_status=$?
          find app/build -type f -name 'lint-results-*.txt' -print -exec cat {} \;
          exit "$lint_status"
      - name: Validate existing production signing configuration
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
      - name: Decode existing production keystore
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hte-release.jks"
          test -s "$RUNNER_TEMP/hte-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hte-release.jks" >> "$GITHUB_ENV"
      - name: Assemble signed production APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK package and signing certificate
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")
          EXPECTED_VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)
          EXPECTED_VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)
          test -n "$EXPECTED_VERSION_CODE"
          test -n "$EXPECTED_VERSION_NAME"
          echo "Expected app version: $EXPECTED_VERSION_NAME ($EXPECTED_VERSION_CODE)"
          echo "$BADGING" | grep -F "package: name='com.hightechentertainment.app' versionCode='$EXPECTED_VERSION_CODE' versionName='$EXPECTED_VERSION_NAME'"
          NATIVE_CODE=$(echo "$BADGING" | sed -n "s/^native-code: //p")
          if [[ -z "$NATIVE_CODE" ]]; then
            echo "No native-code libraries are packaged; Kotlin/Java bytecode is CPU-architecture independent."
          else
            echo "Packaged native ABIs: $NATIVE_CODE"
            for ABI in arm64-v8a armeabi-v7a; do
              if ! echo "$NATIVE_CODE" | grep -q "$ABI"; then
                echo "::error::APK is missing $ABI while native libraries are present; 64-bit and 32-bit ARM phone compatibility cannot both be guaranteed."
                exit 1
              fi
            done
          fi
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Confirm certificate matches previous public release
        env:
          PREVIOUS_APK_URL: https://github.com/suwilanjisinkamba184-cmd/High-tech-entertainment-/releases/download/native-v4.0.4-build37/HTE-Universe-4.0.4.apk
        run: |
          set -euo pipefail
          APK_SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          curl -fsSL "$PREVIOUS_APK_URL" -o "$RUNNER_TEMP/previous-hte-release.apk"
          OLD_CERT="$("$APK_SIGNER" verify --print-certs "$RUNNER_TEMP/previous-hte-release.apk" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          NEW_CERT="$("$APK_SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          if [[ -z "$OLD_CERT" || -z "$NEW_CERT" ]]; then
            echo "::error::Could not extract a SHA-256 signing certificate fingerprint from one of the APKs."
            exit 1
          fi
          if [[ "$OLD_CERT" != "$NEW_CERT" ]]; then
            echo "::error::Production signing certificate differs from the previous public 4.0.4 build 37. Refusing to publish."
            echo "Previous release certificate SHA-256: $OLD_CERT"
            echo "New release certificate SHA-256:      $NEW_CERT"
            exit 1
          fi
          echo "Verified: release certificate matches 4.0.4 build 37."
      - name: Upload signed production APK
        uses: actions/upload-artifact@v7
        with:
          name: hte-universe-release-signed
          path: |
            hte-universe-native/app/build/outputs/apk/release/*.apk
            hte-universe-native/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Prepare permanent release assets
        if: startsWith(github.ref, 'refs/tags/native-v')
        run: |
          set -euo pipefail
          mkdir -p ../release-assets
          cp app/build/outputs/apk/release/app-release.apk ../release-assets/HTE-Universe-4.0.5.apk
          (cd ../release-assets && sha256sum HTE-Universe-4.0.5.apk > SHA256SUMS.txt)
      - name: Check whether this immutable release already exists
        id: release_state
        if: startsWith(github.ref, 'refs/tags/native-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists; it will be verified, never overwritten."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish HTE Universe 4.0.5 GitHub Release
        if: startsWith(github.ref, 'refs/tags/native-v') && steps.release_state.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HTE Universe 4.0.5 — Production build 38
          body: |
            ## HTE Universe 4.0.5

            Official signed Android release from the verified `main` build.

            ### Changes
            - Adaptive settings layout for compact phones, tablets and wide screens.
            - New ten-band studio equalizer curve mapped to each device's supported audio-effect bands.
            - Migration of saved five-band equalizer settings without discarding the user's previous curve.
            - Clearer update-service diagnostics, safer resumable downloads and APK package/version validation.
            - Android emulator launch smoke tests for API 26 and API 35.

            ### Preserved
            - Original High-Tech Entertainment logo, splash screen and startup audio resources.
            - Existing Supabase backend/configuration and OAuth callback.
            - Application ID: `com.hightechentertainment.app`.

            ### Verification
            - Android compilation, unit tests and lint must pass.
            - Signed APK package/version and production certificate verification must pass.
            - Emulator smoke tests target Android 8 (API 26), Android 15 (API 35), and Android 17 (API 37).
            - Minimum supported Android version: Android 8 (API 26); target SDK: 37.
            - Physical-device tests remain separate from CI emulator verification.
          files: |
            release-assets/HTE-Universe-4.0.5.apk
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
      - name: Verify public Android release was actually published
        if: startsWith(github.ref, 'refs/tags/native-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          APK_NAME: HTE-Universe-4.0.5.apk
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_JSON="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets)"
          export RELEASE_JSON
          python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["RELEASE_JSON"])
          expected = os.environ["APK_NAME"]
          if data.get("tagName") != os.environ["RELEASE_TAG"]:
              raise SystemExit("Published release tag does not match the production build.")
          if data.get("isDraft") or data.get("isPrerelease"):
              raise SystemExit("Release exists but is not a public stable release.")
          assets = {asset.get("name") for asset in data.get("assets", [])}
          if expected not in assets:
              raise SystemExit(f"Production APK is missing from release: {expected}")
          print(f"PASS: public release {data['tagName']} contains {expected}.")
          PY
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hte-release.jks"

  emulator-compatibility:
    name: Android API ${{ matrix.api-level }} device smoke test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35, 37]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Run Android 8 / Android 15 emulator smoke test
        if: matrix.api-level != 37
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd hte-universe-native && gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Run Android 17 API 37 preview emulator smoke test
        if: matrix.api-level == 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "emulator" "system-images;android-37.0;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name hte-api37 --package "system-images;android-37.0;google_apis;x86_64" --device "pixel_2"
          "$ANDROID_HOME/emulator/emulator" -avd hte-api37 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data > "$RUNNER_TEMP/emulator-api37.log" 2>&1 &
          adb wait-for-device
          booted=false
          for attempt in $(seq 1 120); do
            if [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [[ "$booted" != "true" ]]; then
            cat "$RUNNER_TEMP/emulator-api37.log"
            echo "::error::Android API 37 emulator did not finish booting."
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          cd hte-universe-native
          gradle --no-daemon :app:connectedDebugAndroidTest --console=plain
