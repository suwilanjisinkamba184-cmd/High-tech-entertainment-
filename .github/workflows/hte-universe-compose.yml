name: HTE Universe — clean Compose rebuild

on:
  push:
    branches: [rebuild/hte-universe-compose-clean]
    paths:
      - 'hte-universe-native/**'
      - '.github/workflows/hte-universe-compose.yml'
  pull_request:
    paths:
      - 'hte-universe-native/**'
      - '.github/workflows/hte-universe-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hte-universe-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile clean Compose application
        run: gradle :app:assembleDebug
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hte-universe-compose-debug
          path: hte-universe-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
