name: HTE Universe — production build and release

on:
  push:
    branches: [main]
    tags: ['native-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hte-universe-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hte-universe-native
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK 37
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Validate Supabase runtime configuration
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          case "$SUPABASE_URL" in https://*) ;; *) exit 1 ;; esac
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug :app:lintRelease --console=plain
      - name: Validate production signing configuration
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
      - name: Decode production keystore
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hte-release.jks"
          test -s "$RUNNER_TEMP/hte-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hte-release.jks" >> "$GITHUB_ENV"
      - name: Assemble signed production APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK identity, version and signer
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          BADGING=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.hightechentertainment.app' versionCode='41' versionName='4.0.7'"
          sha256sum "$APK" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Confirm production certificate continuity
        env:
          PREVIOUS_APK_URL: https://github.com/suwilanjisinkamba184-cmd/High-tech-entertainment-/releases/download/native-v4.0.5-build38/HTE-Universe-4.0.5.apk
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          curl -fsSL "$PREVIOUS_APK_URL" -o "$RUNNER_TEMP/previous.apk"
          OLD_CERT=$("$SIGNER" verify --print-certs "$RUNNER_TEMP/previous.apk" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          NEW_CERT=$("$SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          TRUSTED_CERT_SHA256="6bfa59139e569475fd1843a59216f50cc5bb407df5cf48b8007cc96073adaffa"
          RUNTIME_CERT_SHA256=$(sed -nE 's/^[[:space:]]*const val TRUSTED_CERT_SHA256 = "([0-9a-f]{64})".*/\1/p' app/src/main/java/com/hightechentertainment/app/security/HteSecurityFirewall.kt | head -n1)
          test "$OLD_CERT" = "$TRUSTED_CERT_SHA256"
          test "$NEW_CERT" = "$TRUSTED_CERT_SHA256"
          test "$RUNTIME_CERT_SHA256" = "$TRUSTED_CERT_SHA256"
      - name: Upload signed production APK
        uses: actions/upload-artifact@v7
        with:
          name: hte-universe-release-signed
          path: |
            hte-universe-native/app/build/outputs/apk/release/*.apk
            hte-universe-native/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Prepare permanent release assets
        if: startsWith(github.ref, 'refs/tags/native-v')
        run: |
          set -euo pipefail
          mkdir -p ../release-assets
          cp app/build/outputs/apk/release/app-release.apk ../release-assets/HTE-Universe-4.0.7.apk
          (cd ../release-assets && sha256sum HTE-Universe-4.0.7.apk > SHA256SUMS.txt)
      - name: Publish HTE Universe 4.0.7
        if: startsWith(github.ref, 'refs/tags/native-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HTE Universe 4.0.7 — Production build 41
          body: |
            ## HTE Universe 4.0.7
            Signed production APK, build 41.

            ### Changes
            - Removed GitHub emulator compatibility matrix; CI now focuses on build, unit tests, lint, signing and release integrity.
            - Added first-install device diagnostics and safe local recovery checks.
            - Added diagnostic report screen and founder support escalation.
            - Preserved existing High-Tech Entertainment branding, Supabase backend, package ID and production signing identity.

            Device diagnostics run on the installed phone. Physical-device validation remains the responsibility of real installations and user/device reports.
          files: |
            release-assets/HTE-Universe-4.0.7.apk
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true
      - name: Verify public release assets
        if: startsWith(github.ref, 'refs/tags/native-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["tagName"] == "native-v4.0.7-build41"
          assert not d["isDraft"] and not d["isPrerelease"]
          names={a["name"] for a in d["assets"]}
          assert {"HTE-Universe-4.0.7.apk","SHA256SUMS.txt"} <= names
          print("Public stable release and APK assets verified.")
          PY
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" --pattern "HTE-Universe-4.0.7.apk" --pattern "SHA256SUMS.txt" --dir "$RUNNER_TEMP/published"
          (cd "$RUNNER_TEMP/published" && sha256sum --check SHA256SUMS.txt)
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hte-release.jks"
