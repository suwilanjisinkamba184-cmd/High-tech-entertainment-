name: HTE Universe — production Android build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Build, sign, and publish a production APK'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hte-universe-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hte-universe-native
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      # A marked main-branch commit publishes the signed release after all build checks pass.
      PUBLISH_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-hte-4.1.2-build48]')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: premex-ab/setup-android-cli@ec4f446c5fdea3c206fb73b4b3277709e7227e63
        with:
          packages: |
            platform-tools
            platforms/android-37.0
            build-tools/37.0.0
      - name: Validate Android SDK 37 installation
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Validate Supabase runtime configuration
        if: env.PUBLISH_RELEASE == 'true'
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          case "$SUPABASE_URL" in https://*) ;; *) exit 1 ;; esac
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --console=plain
      - name: Run debug lint
        run: gradle --no-daemon :app:lintDebug --console=plain
      - name: Run release lint
        run: gradle --no-daemon :app:lintRelease --console=plain

      # Pull requests produce an unsigned debug APK for hands-on testing; they never publish a release.
      - name: Assemble debug test APK
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon :app:assembleDebug --console=plain
      - name: Upload debug test APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: hte-universe-pr-${{ github.event.pull_request.number }}-debug-apk
          path: hte-universe-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Production signing and publishing are available only through an explicit manual dispatch.
      - name: Validate production signing configuration
        if: env.PUBLISH_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
      - name: Decode production keystore
        if: env.PUBLISH_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hte-release.jks"
          test -s "$RUNNER_TEMP/hte-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hte-release.jks" >> "$GITHUB_ENV"
      - name: Assemble signed production APK
        if: env.PUBLISH_RELEASE == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --console=plain
      - name: Finalize APK v4 signature
        if: env.PUBLISH_RELEASE == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -s "$APK"
          rm -f "$APK.idsig"
          "$SIGNER" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            "$APK"
          test -s "$APK.idsig"
      - name: Verify production APK identity, version and signer
        if: env.PUBLISH_RELEASE == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -s "$APK"
          VERIFY_OUTPUT=$("$SIGNER" verify --verbose --print-certs --v4-signature-file "$APK.idsig" "$APK")
          printf '%s\n' "$VERIFY_OUTPUT"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" <<< "$VERIFY_OUTPUT"
          grep -F "Verified using v4 scheme (APK Signature Scheme v4): true" <<< "$VERIFY_OUTPUT"
          BADGING=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.hightechentertainment.app' versionCode='48' versionName='4.1.2'"
          sha256sum "$APK" | sed "s|$APK|HTE-Universe-4.1.2.apk|" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Confirm production certificate continuity
        if: env.PUBLISH_RELEASE == 'true'
        env:
          PREVIOUS_APK_URL: https://github.com/suwilanjisinkamba184-cmd/High-tech-entertainment-/releases/download/native-v4.1.2-build46/HTE-Universe-4.1.2.apk
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          curl -fsSL "$PREVIOUS_APK_URL" -o "$RUNNER_TEMP/previous.apk"
          OLD_CERT=$("$SIGNER" verify --print-certs "$RUNNER_TEMP/previous.apk" | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          NEW_CERT=$("$SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          TRUSTED_CERT_SHA256="6bfa59139e569475fd1843a59216f50cc5bb407df5cf48b8007cc96073adaffa"
          RUNTIME_CERT_SHA256=$(sed -nE 's/^[[:space:]]*const val TRUSTED_CERT_SHA256 = "([0-9a-f]{64})".*/\1/p' app/src/main/java/com/hightechentertainment/app/security/HteSecurityFirewall.kt | head -n1)
          test "$OLD_CERT" = "$TRUSTED_CERT_SHA256"
          test "$NEW_CERT" = "$TRUSTED_CERT_SHA256"
          test "$RUNTIME_CERT_SHA256" = "$TRUSTED_CERT_SHA256"
      - name: Prepare production release assets
        if: env.PUBLISH_RELEASE == 'true'
        run: |
          set -euo pipefail
          mkdir -p ../release-assets
          cp app/build/outputs/apk/release/app-release.apk ../release-assets/HTE-Universe-4.1.2.apk
          cp app/build/outputs/apk/release/app-release.apk.idsig ../release-assets/HTE-Universe-4.1.2.apk.idsig
          cp app/build/outputs/apk/release/SHA256SUMS.txt ../release-assets/SHA256SUMS.txt
      - name: Upload verified production APK artifact
        if: env.PUBLISH_RELEASE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: hte-universe-production-4.1.2-build48
          path: |
            release-assets/HTE-Universe-4.1.2.apk
            release-assets/HTE-Universe-4.1.2.apk.idsig
            release-assets/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - name: Publish HTE Universe 4.1.2
        if: env.PUBLISH_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-v4.1.2-build48
          target_commitish: ${{ github.sha }}
          name: HTE Universe 4.1.2 — Production build 48
          body: |
            ## HTE Universe 4.1.2
            Signed production APK, build 48.

            - Built from the current main application source.
            - Production package: com.hightechentertainment.app.
            - Release APK signature and certificate continuity verified.
            - Debug-only APKs are not published as the application download.
          files: |
            release-assets/HTE-Universe-4.1.2.apk
            release-assets/HTE-Universe-4.1.2.apk.idsig
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
      - name: Verify public production release assets
        if: env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: native-v4.1.2-build48
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["tagName"] == "native-v4.1.2-build48"
          assert not d["isDraft"] and not d["isPrerelease"]
          names={a["name"] for a in d["assets"]}
          assert {"HTE-Universe-4.1.2.apk","HTE-Universe-4.1.2.apk.idsig","SHA256SUMS.txt"} <= names
          print("Public stable production release and APK assets verified.")
          PY
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" --pattern "HTE-Universe-4.1.2.apk" --pattern "HTE-Universe-4.1.2.apk.idsig" --pattern "SHA256SUMS.txt" --dir "$RUNNER_TEMP/published"
          (cd "$RUNNER_TEMP/published" && sha256sum --check SHA256SUMS.txt)
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hte-release.jks"
