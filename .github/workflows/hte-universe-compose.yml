name: HTE Universe — production Android build and release

on:
  push:
    branches: [main]
    paths:
      - "hte-universe-native/**"
      - "supabase/config.toml"
      - ".github/workflows/hte-universe-compose.yml"
  pull_request:
    branches: [main]
    paths:
      - "hte-universe-native/**"
      - "supabase/config.toml"
      - ".github/workflows/hte-universe-compose.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Build, sign, and publish a production APK'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hte-universe-android-${{ github.ref }}
  # New PR commits supersede stale validation runs; production runs are never auto-cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android-build:
    name: Android validation (API ${{ matrix.api-level }})
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 35]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: hte-universe-native
    env:
      # These are public client-side values (the publishable key is safe for app/browser clients).
      # Prefer repository secrets/variables when configured; fall back to the same public
      # project configuration already shipped in supabase-config.js so fork PR checks work.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || 'https://wqrxacjbsldbnoekbkbf.supabase.co' }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_hB_aRh-dnicpRQq3wiRtWg_JTdhmMda' }}
      # A marked main-branch commit publishes the signed release after all build checks pass.
      PUBLISH_RELEASE: 'false' # PUBLIC RELEASES TEMPORARILY DISABLED — do not publish APKs until recovery sign-off.
      # Do not sign/build a release candidate during routine PR validation. A candidate requires an explicit manual dispatch; production publishing remains separately gated.
      BUILD_SIGNED_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: premex-ab/setup-android-cli@ec4f446c5fdea3c206fb73b4b3277709e7227e63
        with:
          packages: |
            platform-tools
            platforms/android-37.0
            build-tools/37.0.0
      - name: Validate Android SDK 37 installation
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-37.0"
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      # Supabase configuration is required by every build, including pull requests.
      # Never silently skip this gate: the same BuildConfig values are consumed by
      # SupabaseClientProvider in the installed application.
      - name: Validate Supabase runtime configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          from urllib.parse import urlparse

          url = os.environ.get("SUPABASE_URL", "").strip()
          key = os.environ.get("SUPABASE_PUBLISHABLE_KEY", "").strip()
          if not url or not key:
              sys.exit("Supabase runtime configuration is missing. Set SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository Actions secrets.")
          parsed = urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password or parsed.query or parsed.fragment or parsed.path not in ("", "/"):
              sys.exit("SUPABASE_URL must be a clean HTTPS project URL.")
          if not re.fullmatch(r"[a-z0-9-]+\.supabase\.co", parsed.hostname, re.I):
              sys.exit("SUPABASE_URL host is not a valid Supabase project host.")
          if len(key) < 30 or key.lower() in {"your-key", "your_supabase_key", "placeholder"} or "replace" in key.lower():
              sys.exit("SUPABASE_PUBLISHABLE_KEY is empty, placeholder, or too short.")
          if not (key.startswith("sb_publishable_") or key.startswith("eyJ")):
              sys.exit("SUPABASE_PUBLISHABLE_KEY must be a Supabase publishable key or legacy anon JWT.")
          print("Supabase runtime configuration validated (values redacted).")
          PY
          grep -Fq 'BuildConfig.SUPABASE_URL' app/src/main/java/com/hightechentertainment/app/data/SupabaseClientProvider.kt
          grep -Fq 'BuildConfig.SUPABASE_PUBLISHABLE_KEY' app/src/main/java/com/hightechentertainment/app/data/SupabaseClientProvider.kt
          grep -Fq 'buildConfigField("String", "SUPABASE_URL"' app/build.gradle.kts
          grep -Fq 'buildConfigField("String", "SUPABASE_PUBLISHABLE_KEY"' app/build.gradle.kts
          echo "Supabase runtime BuildConfig wiring verified."
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("../supabase/config.toml").read_text())
          voice = config.get("functions", {}).get("elevenlabs-voice-token", {})
          if voice.get("verify_jwt") is not True:
              raise SystemExit("elevenlabs-voice-token must keep JWT verification enabled.")
          print("Supabase config.toml parsed; voice-token JWT verification is enabled.")
          PY
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --console=plain
      - name: Compile Android instrumentation smoke tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest --console=plain
      - name: Grant the runner access to hardware acceleration
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::The GitHub runner does not expose /dev/kvm; Android x86_64 emulator cannot use hardware acceleration."
            exit 1
          fi
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Run Android instrumentation tests on API ${{ matrix.api-level }} emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash .github/scripts/run-android-instrumentation.sh
      - name: Upload Android emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: hte-android-emulator-diagnostics-api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            hte-universe-native/build/diagnostics/**
            hte-universe-native/app/build/reports/androidTests/connected/**
            hte-universe-native/app/build/outputs/androidTest-results/**
      - name: Run debug lint
        run: gradle --no-daemon :app:lintDebug --console=plain
      - name: Run release lint
        run: gradle --no-daemon :app:lintRelease --console=plain

      # Same-repository PRs build a signed production candidate for installation testing.
      # No debug APK is produced or presented as the installable application.

      # Same-repository pull requests may create signed, non-published candidates.
      # Publishing remains restricted to main; feature branches can never publish a public APK.
      - name: Require main branch for production publishing
        if: matrix.api-level == 35 && env.PUBLISH_RELEASE == 'true'
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production APKs may only be signed and published from refs/heads/main."
            exit 1
          fi
          echo "Production publishing is pinned to main."
      - name: Validate production signing configuration
        if: matrix.api-level == 35 && (env.BUILD_SIGNED_CANDIDATE == 'true' || env.PUBLISH_RELEASE == 'true')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_STORE_PASSWORD"
      - name: Decode production keystore
        if: matrix.api-level == 35 && (env.BUILD_SIGNED_CANDIDATE == 'true' || env.PUBLISH_RELEASE == 'true')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hte-release.jks"
          test -s "$RUNNER_TEMP/hte-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hte-release.jks" >> "$GITHUB_ENV"
      - name: Assemble signed production APK
        if: matrix.api-level == 35 && (env.BUILD_SIGNED_CANDIDATE == 'true' || env.PUBLISH_RELEASE == 'true')
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --console=plain
      - name: Finalize APK v4 signature
        if: matrix.api-level == 35 && (env.BUILD_SIGNED_CANDIDATE == 'true' || env.PUBLISH_RELEASE == 'true')
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -s "$APK"
          rm -f "$APK.idsig"
          "$SIGNER" sign \
            --ks "$ANDROID_KEYSTORE_PATH" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            "$APK"
          test -s "$APK.idsig"
      - name: Verify production APK identity, version and signer
        if: matrix.api-level == 35 && (env.BUILD_SIGNED_CANDIDATE == 'true' || env.PUBLISH_RELEASE == 'true')
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -s "$APK"
          VERIFY_OUTPUT=$("$SIGNER" verify --verbose --print-certs --v4-signature-file "$APK.idsig" "$APK")
          printf '%s\n' "$VERIFY_OUTPUT"
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" <<< "$VERIFY_OUTPUT"
          grep -F "Verified using v4 scheme (APK Signature Scheme v4): true" <<< "$VERIFY_OUTPUT"
          BADGING=$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -F "package: name='com.hightechentertainment.app' versionCode='55' versionName='4.3.1'"
          sha256sum "$APK" | sed "s|$APK|HTE-Universe-4.3.1.apk|" | tee app/build/outputs/apk/release/SHA256SUMS.txt
      - name: Confirm production certificate continuity
        if: matrix.api-level == 35 && (env.BUILD_SIGNED_CANDIDATE == 'true' || env.PUBLISH_RELEASE == 'true')
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          NEW_CERT=$("$SIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}' | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          TRUSTED_CERT_SHA256="6bfa59139e569475fd1843a59216f50cc5bb407df5cf48b8007cc96073adaffa"
          RUNTIME_CERT_SHA256=$(grep -Eo 'TRUSTED_CERT_SHA256 = "[0-9a-f]{64}"' app/src/main/java/com/hightechentertainment/app/security/HteSecurityFirewall.kt | cut -d'"' -f2 | head -n1)
          test "$NEW_CERT" = "$TRUSTED_CERT_SHA256"
          test "$RUNTIME_CERT_SHA256" = "$TRUSTED_CERT_SHA256"
          echo "PASS: candidate matches the pinned trusted signing certificate SHA-256."
      - name: Upload signed production candidate for device testing
        if: matrix.api-level == 35 && env.BUILD_SIGNED_CANDIDATE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: hte-universe-4.3.1-build55-signed-production-candidate
          path: |
            hte-universe-native/app/build/outputs/apk/release/app-release.apk
            hte-universe-native/app/build/outputs/apk/release/app-release.apk.idsig
            hte-universe-native/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
      - name: Prepare production release assets
        if: matrix.api-level == 35 && env.PUBLISH_RELEASE == 'true'
        run: |
          set -euo pipefail
          mkdir -p ../release-assets
          cp app/build/outputs/apk/release/app-release.apk ../release-assets/HTE-Universe-4.3.1.apk
          cp app/build/outputs/apk/release/app-release.apk.idsig ../release-assets/HTE-Universe-4.3.1.apk.idsig
          cp app/build/outputs/apk/release/SHA256SUMS.txt ../release-assets/SHA256SUMS.txt
      - name: Publish HTE Universe 4.3.1
        if: matrix.api-level == 35 && env.PUBLISH_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-v4.3.1-build55
          target_commitish: ${{ github.sha }}
          name: HTE Universe 4.3.1 — Production build 55
          body: |
            ## HTE Universe 4.3.1
            Signed production APK, build 55.

            - Built from the current main application source.
            - Production package: com.hightechentertainment.app.
            - Release APK signature and certificate continuity verified.
            - Debug-only APKs are not published as the application download.
          files: |
            release-assets/HTE-Universe-4.3.1.apk
            release-assets/HTE-Universe-4.3.1.apk.idsig
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
      - name: Verify public production release assets
        if: matrix.api-level == 35 && env.PUBLISH_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: native-v4.3.1-build55
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d["tagName"] == "native-v4.3.1-build55"
          assert not d["isDraft"] and not d["isPrerelease"]
          names={a["name"] for a in d["assets"]}
          assert {"HTE-Universe-4.3.1.apk","HTE-Universe-4.3.1.apk.idsig","SHA256SUMS.txt"} <= names
          print("Public stable production release and APK assets verified.")
          PY
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$RELEASE_TAG" --pattern "HTE-Universe-4.3.1.apk" --pattern "HTE-Universe-4.3.1.apk.idsig" --pattern "SHA256SUMS.txt" --dir "$RUNNER_TEMP/published"
          (cd "$RUNNER_TEMP/published" && sha256sum --check SHA256SUMS.txt)
      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/hte-release.jks"
