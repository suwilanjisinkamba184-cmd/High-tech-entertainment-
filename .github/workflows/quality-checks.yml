name: HTE quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/player-ui-deep-overhaul]

permissions:
  contents: read

jobs:
  web-player:
    name: Validate website player JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check streaming player syntax
        run: node --check assets/streaming.js

  android:
    name: Analyze and build Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-dependency-path: mobile-app/pubspec.lock
      - name: Install dependencies
        working-directory: mobile-app
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: mobile-app
        run: flutter analyze
      - name: Build debug APK
        working-directory: mobile-app
        run: flutter build apk --debug
