name: Build High-Tech Entertainment App

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

concurrency:
  group: hte-mobile-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter platform scaffold
        run: |
          flutter create --platforms=android --org com.hightechentertainment --project-name app "$RUNNER_TEMP/hte_app"
          cp mobile-app/pubspec.yaml "$RUNNER_TEMP/hte_app/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/hte_app/lib"
          cp -R mobile-app/lib "$RUNNER_TEMP/hte_app/lib"
          # Use the checked-in native Android project as the build source of truth.
          # Keep runner-specific local.properties generated by flutter create.
          if [ -d mobile-app/android ]; then
            rsync -a --exclude='local.properties' mobile-app/android/ "$RUNNER_TEMP/hte_app/android/"
          fi
          mkdir -p "$RUNNER_TEMP/hte_app/assets"
          cp -R mobile-app/assets/. "$RUNNER_TEMP/hte_app/assets/"
          python3 -m pip install --quiet cairosvg
          python3 -c "import cairosvg; cairosvg.svg2png(url='$RUNNER_TEMP/hte_app/assets/high-tech-logo.svg', write_to='$RUNNER_TEMP/hte_app/assets/high-tech-logo.png', output_width=1024, output_height=1024)"
      - name: Set Play Store Android identity and target API
        working-directory: ${{ runner.temp }}/hte_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'xmlns:tools=' not in text:
              text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          required_permissions = [
              "android.permission.INTERNET",
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
          ]
          for permission in required_permissions:
              if permission not in text:
                  text = text.replace("<application", f'    <uses-permission android:name="{permission}" />\n    <application', 1)
          text = re.sub(r'android:label="[^"]*"', 'android:label="High-Tech Entertainment"', text)
          # just_audio_background requires its Activity, foreground service and media-button receiver.
          text = re.sub(r'(<activity\\b[^>]*android:name=)"[^"]+"', r'\\1"com.ryanheise.audioservice.AudioServiceActivity"', text, count=1, flags=re.S)
          if "android:scheme=\"com.hightechentertainment.app\"" not in text:
              intent = '''<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.hightechentertainment.app" android:host="login-callback" />
                      </intent-filter>'''
              text = text.replace("</activity>", intent + "\n                  </activity>", 1)
          if 'android:name="com.ryanheise.audioservice.AudioService"' not in text:
              components = '''<service android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true" tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
                  <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true" tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>'''
              text = text.replace("</application>", components + "\n    </application>", 1)
          manifest.write_text(text)
          for path in (Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")):
              if not path.exists():
                  continue
              text = path.read_text()
              if path.name == "build.gradle.kts":
                  text, n = re.subn(r'(?m)^(\s*minSdk\s*=\s*)[^\n]+', r'\g<1>26', text)
              else:
                  text, n = re.subn(r'(?m)^(\s*minSdkVersion\s+)[^\n]+', r'\g<1>26', text)
              if n == 0:
                  raise SystemExit(f"Could not set Android 8 minimum SDK in {path}")
              text, n = re.subn(r'(?m)^(\s*targetSdk\s*=\s*)[^\n]+', r'\g<1>36', text)
              if n == 0:
                  text, n = re.subn(r'(?m)^(\s*targetSdkVersion\s*=\s*)[^\n]+', r'\g<1>36', text)
              if n == 0:
                  text, n = re.subn(r'(?m)^(\s*targetSdkVersion\s+)[^\n]+', r'\g<1>36', text)
              if n == 0:
                  raise SystemExit(f"Could not set Android 16 target SDK in {path}")
              path.write_text(text)
          PY
          grep -R -E "minSdk|targetSdk" android/app/build.gradle*
      - name: Persist the native Android project in Git
        env:
          GH_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # The generated Android platform must live in the repository, not only
          # in a disposable runner directory. This keeps the package identity,
          # manifest deep link, Gradle configuration and native entry point stable.
          rm -rf mobile-app/android
          cp -R "${{ runner.temp }}/hte_app/android" mobile-app/android
          # Never commit machine-specific Android SDK paths or signing credentials.
          rm -f mobile-app/android/local.properties
          git rm --cached --ignore-unmatch mobile-app/android/local.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mobile-app/android
          if ! git diff --cached --quiet; then
            git commit -m "Add permanent native Android platform project"
            git push origin "HEAD:$GH_BRANCH"
          else
            echo "Native Android platform project is already current."
          fi
      - name: Configure Android upload-key signing
        id: android_signing
        working-directory: ${{ runner.temp }}/hte_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hte-upload-key.jks"
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/hte-upload-key.jks
          EOF
            python3 - <<'PY'
          from pathlib import Path
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          if kts.exists():
              text = kts.read_text()
              imports = 'import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(FileInputStream(keystorePropertiesFile)) }\n\n'
              if "val keystorePropertiesFile" not in text:
                  text = imports + text
              block = '''    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
              if 'create("release")' not in text:
                  text = text.replace("    buildTypes {", block + "    buildTypes {")
              text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              kts.write_text(text)
          elif groovy.exists():
              text = groovy.read_text()
              imports = "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('key.properties')\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n\n"
              if "keystorePropertiesFile" not in text:
                  text = imports + text
              block = """    signingConfigs {
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile file(keystoreProperties['storeFile'])
                  storePassword keystoreProperties['storePassword']
              }
          }
          """
              if "signingConfigs {" not in text:
                  text = text.replace("    buildTypes {", block + "    buildTypes {")
              text = text.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              groovy.write_text(text)
          else:
              raise SystemExit("Android Gradle build file not found")
          PY
            echo "release_signing_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No upload-key secrets configured; this build will use debug signing and is for testing only."
            echo "release_signing_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies and generate branded launcher icon
        working-directory: ${{ runner.temp }}/hte_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter analyze lib
      - name: Build Android APK and (when release-signed) Play Store bundle
        working-directory: ${{ runner.temp }}/hte_app
        env:
          RELEASE_SIGNING_READY: ${{ steps.android_signing.outputs.release_signing_ready }}
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64
          if [ "$RELEASE_SIGNING_READY" = "true" ]; then
            flutter build appbundle --release
          else
            echo "Skipping AAB: configure the four ANDROID_* upload-key repository secrets to create a Play Store-ready bundle."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: high-tech-entertainment-android
          path: |
            ${{ runner.temp }}/hte_app/build/app/outputs/flutter-apk/app-release.apk
            ${{ runner.temp }}/hte_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Flutter platform scaffold
        shell: pwsh
        run: |
          flutter create --platforms=windows --org com.hightechentertainment --project-name app "$env:RUNNER_TEMP\hte_app"
          Copy-Item mobile-app\pubspec.yaml "$env:RUNNER_TEMP\hte_app\pubspec.yaml" -Force
          Remove-Item "$env:RUNNER_TEMP\hte_app\lib" -Recurse -Force
          Copy-Item mobile-app\lib "$env:RUNNER_TEMP\hte_app\lib" -Recurse
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\hte_app\assets" | Out-Null
          Copy-Item mobile-app\assets\* "$env:RUNNER_TEMP\hte_app\assets" -Recurse -Force
          # Windows desktop uses the bundled SVG at runtime; no Cairo native library is required.
      - name: Build Windows app
        shell: pwsh
        working-directory: ${{ runner.temp }}\hte_app
        run: |
          flutter pub get
          flutter build windows --release
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path "$env:RUNNER_TEMP\hte_app\build\windows\x64\runner\Release\*" -DestinationPath "$env:RUNNER_TEMP\high-tech-entertainment-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: high-tech-entertainment-windows
          path: ${{ runner.temp }}/high-tech-entertainment-windows.zip
          if-no-files-found: error

