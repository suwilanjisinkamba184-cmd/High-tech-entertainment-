name: High-Tech Entertainment - Android Release & OTA

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/lib/**'
      - 'mobile-app/test/**'
      - 'mobile-app/assets/**'
      - 'mobile-app/pubspec.yaml'
      - 'mobile-app/shorebird.yaml'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: "Choose automatic detection, an OTA patch, or a full APK release"
        required: true
        type: choice
        options: [auto, patch, release]
        default: auto

concurrency:
  group: hte-mobile-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17 for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Setup Shorebird
        if: github.event_name != 'pull_request'
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Select OTA operation
        id: ota_mode
        shell: bash
        env:
          REQUESTED_OPERATION: ${{ inputs.operation || 'auto' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          event = os.environ["EVENT_NAME"]
          mode = "validate" if event == "pull_request" else os.environ["REQUESTED_OPERATION"]
          if mode == "auto":
              if not Path("mobile-app/shorebird.yaml").exists():
                  mode = "release"
              elif event == "push":
                  before = os.environ.get("EVENT_BEFORE", "")
                  if not before or set(before) == {"0"}:
                      mode = "release"
                  else:
                      changed = subprocess.check_output(["git", "diff", "--name-only", before, os.environ["EVENT_SHA"]], text=True).splitlines()
                      patch_safe = (".github/workflows/mobile-build.yml", "mobile-app/shorebird.yaml", "mobile-app/README.md")
                      pubspec_version_only = False
                      version_bumped = False
                      if "mobile-app/pubspec.yaml" in changed:
                          old_pubspec = subprocess.check_output(
                              ["git", "show", f"{before}:mobile-app/pubspec.yaml"], text=True
                          )
                          new_pubspec = Path("mobile-app/pubspec.yaml").read_text()
                          old_version = next(line.split(":", 1)[1].strip() for line in old_pubspec.splitlines() if line.startswith("version:"))
                          new_version = next(line.split(":", 1)[1].strip() for line in new_pubspec.splitlines() if line.startswith("version:"))
                          version_bumped = old_version != new_version
                          pubspec_diff = subprocess.check_output(
                              ["git", "diff", before, os.environ["EVENT_SHA"], "--", "mobile-app/pubspec.yaml"],
                              text=True,
                          ).splitlines()
                          meaningful = [
                              line for line in pubspec_diff
                              if line.startswith(("+", "-"))
                              and not line.startswith(("+++", "---"))
                              and not line[1:].startswith("version:")
                          ]
                          pubspec_version_only = not meaningful
                      patch_safe_changes = changed and all(
                          (p.startswith("mobile-app/lib/") and p.endswith(".dart"))
                          or (p.startswith("mobile-app/test/") and p.endswith("_test.dart"))
                          or p in patch_safe
                          or (p == "mobile-app/pubspec.yaml" and pubspec_version_only)
                          for p in changed
                      )
                      has_dart_changes = any(p.startswith("mobile-app/lib/") and p.endswith(".dart") for p in changed)
                      mode = "release" if version_bumped else ("patch" if patch_safe_changes and has_dart_changes else ("validate" if patch_safe_changes else "release"))
              else:
                  mode = "release"
          if mode == "patch" and not Path("mobile-app/shorebird.yaml").exists():
              raise SystemExit("Cannot publish an OTA patch before the first Shorebird release.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("mode=" + mode + chr(10))
          print("Selected OTA operation:", mode)
          PY
      - name: Install Android 36 platform, build tools and native toolchain
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Read Android app version
        id: app_version
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          line = next(line for line in Path("mobile-app/pubspec.yaml").read_text().splitlines() if line.startswith("version:"))
          raw_version = line.split(":", 1)[1].strip()
          version, build = raw_version.split("+", 1) if "+" in raw_version else (raw_version, "1")
          if not version or version.count(".") != 2 or not build.isdigit():
              raise SystemExit("Invalid semantic app version/build number in pubspec.yaml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("version=" + version + "\n")
              output.write("build=" + build + "\n")
          PY
      - name: Create Flutter platform scaffold
        run: |
          flutter create --platforms=android --org com.hightechentertainment --project-name app "$RUNNER_TEMP/hte_app"
          cp mobile-app/pubspec.yaml "$RUNNER_TEMP/hte_app/pubspec.yaml"
          rm -rf "$RUNNER_TEMP/hte_app/lib" "$RUNNER_TEMP/hte_app/test"
          cp -R mobile-app/lib "$RUNNER_TEMP/hte_app/lib"
          if [ -d mobile-app/test ]; then
            cp -R mobile-app/test "$RUNNER_TEMP/hte_app/test"
          else
            mkdir -p "$RUNNER_TEMP/hte_app/test"
          fi
          mkdir -p "$RUNNER_TEMP/hte_app/assets"
          cp -R mobile-app/assets/. "$RUNNER_TEMP/hte_app/assets/"
          # shorebird.yaml is declared as a Flutter asset in pubspec.yaml.
          # Copy it for PR validation too; OTA setup itself remains skipped on PRs.
          if [ -f mobile-app/shorebird.yaml ]; then
            cp mobile-app/shorebird.yaml "$RUNNER_TEMP/hte_app/shorebird.yaml"
          fi
          python3 -m pip install --quiet cairosvg
          python3 -c "import cairosvg; cairosvg.svg2png(url='$RUNNER_TEMP/hte_app/assets/high-tech-logo.svg', write_to='$RUNNER_TEMP/hte_app/assets/high-tech-logo.png', output_width=1024, output_height=1024)"
      - name: Configure a Flutter-compatible Android Gradle toolchain
        working-directory: ${{ runner.temp }}/hte_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          app_gradle = Path("android/app/build.gradle.kts")
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          properties = Path("android/gradle.properties")
          for path in (settings, app_gradle, wrapper, properties):
              if not path.exists():
                  raise SystemExit(f"Required Flutter Android scaffold file missing: {path}")

          settings_lines = settings.read_text().splitlines()
          agp_updated = False
          kotlin_updated = False
          for index, line in enumerate(settings_lines):
              if 'id("com.android.application")' in line:
                  settings_lines[index] = re.sub(r'version\s+"[^"]+"', 'version "8.11.1"', line, count=1)
                  agp_updated = 'version "8.11.1"' in settings_lines[index]
              if 'id("org.jetbrains.kotlin.android")' in line:
                  settings_lines[index] = re.sub(r'version\s+"[^"]+"', 'version "2.2.20"', line, count=1)
                  kotlin_updated = 'version "2.2.20"' in settings_lines[index]
          if not agp_updated or not kotlin_updated:
              raise SystemExit("Could not pin Android Gradle Plugin 8.11.1 and Kotlin 2.2.20.")
          settings.write_text("\n".join(settings_lines) + "\n")

          app_text = app_gradle.read_text()
          if "dev.flutter.flutter-gradle-plugin" not in app_text:
              raise SystemExit("The Flutter Gradle plugin declaration is missing.")
          if 'id("kotlin-android")' not in app_text and 'id("org.jetbrains.kotlin.android")' not in app_text:
              app_text = app_text.replace("plugins {", 'plugins {\n    id("org.jetbrains.kotlin.android")', 1)
              app_gradle.write_text(app_text)

          wrapper_lines = wrapper.read_text().splitlines()
          wrapper_lines = [
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip"
              if line.startswith("distributionUrl=") else line
              for line in wrapper_lines
          ]
          if not any("gradle-8.14-all.zip" in line for line in wrapper_lines):
              raise SystemExit("Could not configure Gradle 8.14.")
          wrapper.write_text("\n".join(wrapper_lines) + "\n")

          property_lines = [
              line for line in properties.read_text().splitlines()
              if not line.startswith(("android.builtInKotlin=", "android.newDsl="))
          ]
          property_lines.extend(["android.builtInKotlin=false", "android.newDsl=false"])
          properties.write_text("\n".join(property_lines) + "\n")
          print("PASS: Flutter 3.47.9 / AGP 8.11.1 / Gradle 8.14 / Kotlin 2.2.20.")
          PY
      - name: Set Play Store Android identity, SDK levels and target API
        working-directory: ${{ runner.temp }}/hte_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'xmlns:tools=' not in text:
              text = text.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          required_permissions = [
              "android.permission.INTERNET",
              "android.permission.WAKE_LOCK",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK",
              "android.permission.REQUEST_INSTALL_PACKAGES",
          ]
          for permission in required_permissions:
              if permission not in text:
                  text = text.replace("<application", f'    <uses-permission android:name="{permission}" />\n    <application', 1)
          text = re.sub(r'android:label="[^"]*"', 'android:label="High-Tech Entertainment"', text)
          activity_pattern = r'(<activity\b(?:(?!>).)*?\bandroid:name=")[^"]+"'
          text, activity_count = re.subn(
              activity_pattern,
              r'\1com.ryanheise.audioservice.AudioServiceActivity"',
              text,
              count=1,
              flags=re.S,
          )
          if activity_count != 1 or 'android:name="com.ryanheise.audioservice.AudioServiceActivity"' not in text:
              raise SystemExit("Could not set the required AudioServiceActivity in AndroidManifest.xml")
          if "android:scheme=\"com.hightechentertainment.app\"" not in text:
              intent = """<intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.hightechentertainment.app" android:host="login-callback" />
                      </intent-filter>"""
              text = text.replace("</activity>", intent + "\n                  </activity>", 1)
          if 'android:name="com.ryanheise.audioservice.AudioService"' not in text:
              components = """<service android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true" tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>
                  <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true" tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>"""
              text = text.replace("</application>", components + "\n    </application>", 1)
          manifest.write_text(text)
          gradle_files = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          found = False
          for path in gradle_files:
              if not path.exists():
                  continue
              found = True
              text = path.read_text()
              if path.name == "build.gradle.kts":
                  text, min_n = re.subn(r'(?m)^(\s*minSdk\s*=\s*)[^\n]+', r'\g<1>26', text)
                  text, compile_n = re.subn(r'(?m)^(\s*compileSdk\s*=\s*)[^\n]+', r'\g<1>36', text)
                  text, target_n = re.subn(r'(?m)^(\s*targetSdk\s*=\s*)[^\n]+', r'\g<1>36', text)
              else:
                  text, min_n = re.subn(r'(?m)^(\s*minSdkVersion\s+)[^\n]+', r'\g<1>26', text)
                  text, compile_n = re.subn(r'(?m)^(\s*compileSdkVersion?\s+)[^\n]+', r'\g<1>36', text)
                  text, target_n = re.subn(r'(?m)^(\s*targetSdkVersion\s+)[^\n]+', r'\g<1>36', text)
              if min_n == 0 or compile_n == 0 or target_n == 0:
                  raise SystemExit(f"Could not configure minSdk 26, compileSdk 36 and targetSdk 36 in {path}")
              if path.name == "build.gradle.kts" and 'create("su")' not in text:
                  flavor = """    flavorDimensions += "edition"
              productFlavors {
                  create("su") { dimension = "edition"; versionNameSuffix = " SU" }
              }
          """
                  text = text.replace("    buildTypes {", flavor + "    buildTypes {", 1)
              elif path.name == "build.gradle" and "su {" not in text:
                  flavor = """    flavorDimensions "edition"
              productFlavors {
                  su { dimension "edition"; versionNameSuffix " SU" }
              }
          """
                  text = text.replace("    buildTypes {", flavor + "    buildTypes {", 1)
              path.write_text(text)
          if not found:
              raise SystemExit("Android app Gradle build file not found")
          PY
          grep -R -E "minSdk|compileSdk|targetSdk" android/app/build.gradle*
      - name: Configure Shorebird app identity
        if: steps.ota_mode.outputs.mode != 'validate'
        working-directory: ${{ runner.temp }}/hte_app
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        shell: bash
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "::error::SHOREBIRD_TOKEN is missing from repository Actions secrets."
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/mobile-app/shorebird.yaml" ]; then
            cp "$GITHUB_WORKSPACE/mobile-app/shorebird.yaml" shorebird.yaml
            python3 - <<'PY'
          from pathlib import Path
          path = Path("pubspec.yaml")
          text = path.read_text()
          if "    - shorebird.yaml" not in text:
              marker = "  assets:" + chr(10)
              if marker not in text:
                  raise SystemExit("Could not find Flutter assets section in pubspec.yaml")
              path.write_text(text.replace(marker, marker + "    - shorebird.yaml" + chr(10), 1))
          PY
          else
            shorebird init --display-name "High-Tech Entertainment"
            cp shorebird.yaml "$GITHUB_WORKSPACE/mobile-app/shorebird.yaml"
            cp pubspec.yaml "$GITHUB_WORKSPACE/mobile-app/pubspec.yaml"
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mobile-app/shorebird.yaml mobile-app/pubspec.yaml
            git commit -m "Initialize Shorebird OTA updates"
            git push origin "HEAD:${{ github.ref_name }}"
            cd "$RUNNER_TEMP/hte_app"
          fi
      - name: Configure Android upload-key signing
        id: android_signing
        working-directory: ${{ runner.temp }}/hte_app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_STORE_PASSWORD" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hte-upload-key.p12"
            keytool -list -keystore "$RUNNER_TEMP/hte-upload-key.p12" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
            CERT_SHA256="$(keytool -list -v -keystore "$RUNNER_TEMP/hte-upload-key.p12" -storepass "$ANDROID_STORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$CERT_SHA256" ]; then
              echo "::error::Could not read the upload certificate SHA-256 fingerprint."
              exit 1
            fi
            echo "release_cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
            cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/hte-upload-key.p12
          EOF
            python3 - <<'PY'
          from pathlib import Path
          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          if kts.exists():
              text = kts.read_text()
              imports = 'import java.util.Properties\nimport java.io.FileInputStream\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(FileInputStream(keystorePropertiesFile)) }\n\n'
              if "val keystorePropertiesFile" not in text:
                  text = imports + text
              block = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          """
              if 'create("release")' not in text:
                  text = text.replace("    buildTypes {", block + "    buildTypes {")
              text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              kts.write_text(text)
          elif groovy.exists():
              text = groovy.read_text()
              imports = "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('key.properties')\nif (keystorePropertiesFile.exists()) { keystoreProperties.load(new FileInputStream(keystorePropertiesFile)) }\n\n"
              if "keystorePropertiesFile" not in text:
                  text = imports + text
              block = """    signingConfigs {
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile file(keystoreProperties['storeFile'])
                  storePassword keystoreProperties['storePassword']
              }
          }
          """
              if "signingConfigs {" not in text:
                  text = text.replace("    buildTypes {", block + "    buildTypes {")
              text = text.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
              groovy.write_text(text)
          else:
              raise SystemExit("Android Gradle build file not found")
          PY
            echo "release_signing_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::One or more required Android signing secrets are missing or empty. Add all four repository Actions secrets before building a distributable APK."
            exit 1
          fi
      - name: Verify bundled startup sound and scheduled advert
        working-directory: ${{ runner.temp }}/hte_app
        run: |
          for asset in assets/high-tech-startup.mp3 assets/AUD-20261103-WA0002.mp3 assets/high-tech-logo.svg; do
            test -s "$asset" || { echo "::error::Required High-Tech asset is missing: $asset"; find assets -maxdepth 1 -type f -printf "%f %s bytes\\n"; exit 1; }
            echo "PASS: $asset ($(stat -c%s "$asset") bytes)."
          done
      - name: Verify startup MP3 decodes successfully
        timeout-minutes: 4
        working-directory: ${{ runner.temp }}/hte_app
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            timeout 90s sudo apt-get update
            timeout 60s sudo apt-get install --yes ffmpeg
          fi
          DURATION="$(timeout 20s ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 assets/high-tech-startup.mp3)"
          python3 - "$DURATION" <<'PY'
          import sys
          try:
              duration = float(sys.argv[1])
          except (IndexError, ValueError):
              raise SystemExit("Startup MP3 duration could not be read.")
          if duration <= 0:
              raise SystemExit("Startup MP3 has no playable duration.")
          print(f"PASS: startup MP3 metadata is valid ({duration:.2f} seconds).")
          PY
          timeout 30s ffmpeg -nostdin -v error -i assets/high-tech-startup.mp3 -f null -
          echo "PASS: startup MP3 decoded without audio-stream errors."
      - name: Install dependencies and generate branded launcher icon
        working-directory: ${{ runner.temp }}/hte_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter test
          flutter analyze
      - name: Align Android plugin compile SDK with API 36
        working-directory: ${{ runner.temp }}/hte_app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          if not cache.exists():
              raise SystemExit("Pub package cache was not found.")
          pattern = re.compile(r"(?m)^(\s*compileSdk(?:Version)?\s*(?:=\s*)?)(\d+)(\s*(?://.*)?$)")
          changed = []
          for gradle in cache.glob("*/android/build.gradle*"):
              source = gradle.read_text()
              updated, count = pattern.subn(
                  lambda match: match.group(1) + "36" + match.group(3)
                  if int(match.group(2)) < 36 else match.group(0),
                  source,
              )
              if count and updated != source:
                  gradle.write_text(updated)
                  changed.append(str(gradle))
          picker = list(cache.glob("file_picker-*/android/build.gradle*"))
          if not picker:
              raise SystemExit("Resolved file_picker Android Gradle file was not found.")
          picker_text = "\n".join(path.read_text() for path in picker)
          if re.search(r"(?m)^\s*compileSdk(?:Version)?\s*(?:=\s*)?34\b", picker_text):
              raise SystemExit("file_picker is still configured for Android API 34.")
          print(f"Updated plugin Android compile SDK declarations: {len(changed)}")
          print("\n".join(changed))
          PY
      - name: Check optional native Google sign-in configuration
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID is not configured. The app will use the configured Supabase Google OAuth deep-link fallback."
          else
            echo "PASS: Native Google sign-in client configuration is present."
          fi
      - name: Build Shorebird release APK
        if: steps.ota_mode.outputs.mode == 'release'
        working-directory: ${{ runner.temp }}/hte_app
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: shorebird release android --flavor su --artifact apk --target-platform android-arm,android-arm64 -- --dart-define="HTE_GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
      - name: Verify OTA patch asset and icon compatibility
        # Only a publishable Dart patch needs an existing release baseline. PR validation builds a separate APK and must also support version-bump PRs.
        if: steps.ota_mode.outputs.mode == 'patch'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          baseline_ref = f"origin/{os.environ['BASE_REF']}" if os.environ["EVENT_NAME"] == "pull_request" else "HEAD"
          baseline_pubspec = subprocess.check_output(
              ["git", "show", f"{baseline_ref}:mobile-app/pubspec.yaml"], text=True
          )
          version_line = next(line for line in baseline_pubspec.splitlines() if line.startswith("version:"))
          version, build = version_line.split(":", 1)[1].strip().split("+", 1)
          os.environ["OTA_BASELINE_VERSION"] = version
          tag = f"v{version}-SU"
          try:
              base = subprocess.check_output(
                  ["git", "rev-parse", "--verify", f"{tag}^{{commit}}"],
                  text=True,
              ).strip()
          except subprocess.CalledProcessError:
              raise SystemExit(f"OTA baseline tag {tag} is missing; publish a full Shorebird release first.")
          if subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"]).returncode != 0:
              raise SystemExit(f"OTA baseline {tag} is not an ancestor of HEAD; refusing an unsafe patch.")
          baseline_files = subprocess.check_output(
              ["git", "ls-tree", "-r", "--name-only", base, "mobile-app/lib"],
              text=True,
          ).splitlines()
          def read_source(path, revision=None):
              if revision:
                  return subprocess.check_output(["git", "show", f"{revision}:{path}"], text=True)
              return Path(path).read_text()
          def icons(files, revision=None):
              found = set()
              for path in files:
                  found.update(re.findall(r"Icons\.([A-Za-z0-9_]+)", read_source(path, revision)))
              return found
          current_files = sorted(str(path) for path in Path("mobile-app/lib").rglob("*.dart"))
          new_icons = sorted(icons(current_files) - icons(baseline_files, base))
          if new_icons:
              raise SystemExit(f"OTA uses Material icons absent from the {tag} base font: " + ", ".join(new_icons))
          changed_assets = subprocess.check_output(
              ["git", "diff", "--name-only", base, "HEAD", "--", "mobile-app/assets"],
              text=True,
          ).splitlines()
          if changed_assets:
              raise SystemExit("OTA cannot deliver changed bundled assets: " + ", ".join(changed_assets))
          print(f"PASS: Dart patch is compatible with the exact full-release baseline {tag}.")
          PY
      - name: Publish OTA patch for Dart-only changes
        if: steps.ota_mode.outputs.mode == 'patch'
        working-directory: ${{ runner.temp }}/hte_app
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        # Resolve the installed Shorebird baseline from the current app version/build.
        # Version bumps are forced into full-release mode above, never OTA patch mode.
        # Flutter may regenerate the tree-shaken MaterialIcons font; compatibility checks
        # reject new glyphs and changed source assets before allowing this patch.
        run: |
          # GITHUB_ENV values are only visible to later steps, not this shell.
          # Resolve the exact full-release version into this step's environment.
          read -r OTA_BASELINE_VERSION OTA_BASELINE_BUILD < <(python3 - <<'PY'
          from pathlib import Path
          line = next(line for line in Path("pubspec.yaml").read_text().splitlines() if line.startswith("version:"))
          version, build = line.split(":", 1)[1].strip().split("+", 1)
          print(version, build)
          PY
          )
          if [ -z "$OTA_BASELINE_VERSION" ] || [ -z "$OTA_BASELINE_BUILD" ]; then
            echo "::error::Could not resolve the exact Shorebird release version/build from pubspec.yaml."
            exit 1
          fi
          echo "Publishing OTA patch against High-Tech Entertainment $OTA_BASELINE_VERSION+$OTA_BASELINE_BUILD (SU flavour)"
          # Shorebird patches are Dart-only. Never bypass native-code or asset
          # compatibility checks: those changes require a full APK release.
          shorebird patch android --flavor su --release-version "$OTA_BASELINE_VERSION SU+$OTA_BASELINE_BUILD" --track stable -- --dart-define="HTE_GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
      - name: Build validation APK (non-release checks)
        if: steps.ota_mode.outputs.mode == 'validate'
        working-directory: ${{ runner.temp }}/hte_app
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: flutter build apk --flavor su --release --target-platform android-arm,android-arm64 --dart-define="HTE_GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
      - name: Verify release APK signature
        if: steps.ota_mode.outputs.mode == 'release' || steps.ota_mode.outputs.mode == 'validate'
        working-directory: ${{ runner.temp }}/hte_app
        env:
          EXPECTED_CERT_SHA256: ${{ steps.android_signing.outputs.release_cert_sha256 }}
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-su-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -s "$APK" ]; then
            echo "::error::Signed APK verification executed, but no APK was produced by the build step."
            exit 1
          fi
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not installed."
            exit 1
          fi
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Expected upload certificate fingerprint is missing."
            exit 1
          fi
          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)" || {
            printf '%s\n' "$VERIFY_OUTPUT"
            echo "::error::APK signature verification failed."
            exit 1
          }
          printf '%s\n' "$VERIFY_OUTPUT"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL_CERT_SHA256" ] || [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is not signed with the configured High-Tech Entertainment upload certificate."
            exit 1
          fi
          echo "PASS: APK signature is valid and matches the configured upload certificate."
      - name: Apply official High-Tech Entertainment download filename
        if: steps.ota_mode.outputs.mode == 'release' || steps.ota_mode.outputs.mode == 'validate'
        working-directory: ${{ runner.temp }}/hte_app
        run: |
          APK="build/app/outputs/flutter-apk/app-su-release.apk"
          test -s "$APK" || { echo "::error::Expected SU APK was not found: $APK"; find build/app/outputs -maxdepth 5 -type f -print; exit 1; }
          mv "$APK" "build/app/outputs/flutter-apk/High-Tech-Entertainment-v${{ steps.app_version.outputs.version }}-SU.apk"
      - name: Upload standalone Android APK
        if: steps.ota_mode.outputs.mode == 'release' || steps.ota_mode.outputs.mode == 'validate'
        uses: actions/upload-artifact@v4
        with:
          name: High-Tech-Entertainment-v${{ steps.app_version.outputs.version }}-SU-APK
          path: ${{ runner.temp }}/hte_app/build/app/outputs/flutter-apk/High-Tech-Entertainment-v${{ steps.app_version.outputs.version }}-SU.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish public Android APK release
        if: github.event_name != 'pull_request' && steps.ota_mode.outputs.mode == 'release' && steps.android_signing.outputs.release_signing_ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}-SU
          name: High-Tech Entertainment v${{ steps.app_version.outputs.version }} SU
          target_commitish: ${{ github.sha }}
          body: |
            Official High-Tech Entertainment Android SU flavour. Semantic version: ${{ steps.app_version.outputs.version }}; Android build: ${{ steps.app_version.outputs.build }}. SU identifies this build flavour.
            Download the APK and install it on a compatible Android device.
            This release is signed with the project's private upload key.
          files: ${{ runner.temp }}/hte_app/build/app/outputs/flutter-apk/High-Tech-Entertainment-v${{ steps.app_version.outputs.version }}-SU.apk
          overwrite_files: true
          make_latest: true

      - name: Verify public Android release was actually published
        if: steps.ota_mode.outputs.mode == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.app_version.outputs.version }}-SU
          APK_NAME: High-Tech-Entertainment-v${{ steps.app_version.outputs.version }}-SU.apk
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "::error::A pull request cannot publish an official Android release."
            exit 1
          fi
          export RELEASE_JSON="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets)"
          python3 - <<'PY'
          import json, os, sys
          data = json.loads(os.environ["RELEASE_JSON"])
          expected = os.environ["APK_NAME"]
          if data.get("tagName") != os.environ["RELEASE_TAG"]:
              raise SystemExit("Published release tag does not match the requested app version.")
          if data.get("isDraft") or data.get("isPrerelease"):
              raise SystemExit("Android release exists but is draft or prerelease.")
          assets = {asset.get("name") for asset in data.get("assets", [])}
          if expected not in assets:
              raise SystemExit(f"Official APK asset is missing from the public release: {expected}")
          print(f"PASS: public release {data['tagName']} contains {expected}.")
          PY
