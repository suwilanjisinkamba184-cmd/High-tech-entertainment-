name: HTE Universe — website validation

on:
  pull_request:
    branches: [main]
    paths:
      - "website/**"
      - "assets/app.js"
      - "assets/videos.js"
      - ".github/workflows/website-validation.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/app.js"
      - "assets/videos.js"
      - ".github/workflows/website-validation.yml"

permissions:
  contents: read

concurrency:
  group: hte-website-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate browser scripts
        run: |
          node --check assets/app.js
          node --check assets/videos.js
      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund
      - name: Check Astro pages and TypeScript
        working-directory: website
        run: npm run check
      - name: Build GitHub Pages website
        working-directory: website
        run: npm run build
