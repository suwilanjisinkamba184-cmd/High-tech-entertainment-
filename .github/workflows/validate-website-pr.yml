name: Validate website redesign

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'website/**'
      - 'database/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'SUPABASE-CONNECTION.md'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/publish-github-pages.yml'
      - 'account/**'
      - 'admin/**'
      - 'assets/**'
      - 'scripts/build-website.sh'
      - '.github/workflows/validate-website-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/videos.js
          node --check assets/experience.js
      - name: Build and validate GitHub Pages website
        run: bash scripts/build-website.sh