name: Validate website redesign

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'website/**'
      - 'database/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'sitemap.xml'
      - 'robots.txt'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/publish-github-pages.yml'
      - 'account/**'
      - 'admin/**'
      - 'assets/**'
      - 'scripts/build-website.sh'
      - '.github/workflows/validate-website-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/videos.js
          node --check assets/experience.js
      - name: Build and validate published website
        run: bash scripts/build-website.sh
      - name: Validate root-hosted Cloudflare and Netlify asset base
        run: |
          CF_PAGES=1 npm --prefix website run build
          if grep -q '/High-tech-entertainment-/_astro/' website/dist/index.html; then
            echo "::error::Root-hosted build retained the GitHub Pages subpath."
            exit 1
          fi
          grep -q 'src="/_astro/' website/dist/index.html || grep -q 'href="/_astro/' website/dist/index.html
