name: Deploy High-Tech Entertainment to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          mkdir -p _site
          cp index.html supabase-config.js robots.txt sitemap.xml high-tech-logo.svg _site/
          cp -R assets account admin _site/
          if [ -f privacy-policy.html ]; then cp privacy-policy.html _site/; fi
          if [ -f account-deletion.html ]; then cp account-deletion.html _site/; fi
          if [ -f google31fdb4754075f7bd.html ]; then cp google31fdb4754075f7bd.html _site/; fi
          if [ -f googled2aa97c2eb951371.html ]; then cp googled2aa97c2eb951371.html _site/; fi
          test -s _site/index.html
          test -s _site/assets/app.js
          test -s _site/admin/index.html
          test -s _site/account/index.html
          node --check _site/assets/app.js
          node --check _site/assets/streaming.js
          node --check _site/assets/videos.js
          node --check _site/assets/admin-upload.js
          node --check _site/assets/admin-video.js
          node --check _site/assets/admin-ui.js
          node --check _site/assets/ai-ad-studio.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
