name: High-Tech Entertainment — Native Android Signed Candidate

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub prerelease after signing (not an OTA install)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hte-native-signed-candidate
  cancel-in-progress: false

jobs:
  signed-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build release APK
        working-directory: native-android
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign release APK using repository signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/upload.p12"
          APK="$(find native-android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/signing/upload.p12" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/High-Tech-Entertainment-native-signed.apk" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/High-Tech-Entertainment-native-signed.apk"
          sha256sum "$RUNNER_TEMP/High-Tech-Entertainment-native-signed.apk" | tee "$RUNNER_TEMP/SHA256SUMS.txt"
          rm -rf "$RUNNER_TEMP/signing"
      - name: Upload signed candidate and checksum
        uses: actions/upload-artifact@v4
        with:
          name: high-tech-entertainment-native-signed-candidate
          path: |
            ${{ runner.temp }}/High-Tech-Entertainment-native-signed.apk
            ${{ runner.temp }}/SHA256SUMS.txt
          retention-days: 30
      - name: Publish candidate prerelease only when explicitly requested
        if: inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "native-candidate-${GITHUB_RUN_NUMBER}" \
            "$RUNNER_TEMP/High-Tech-Entertainment-native-signed.apk" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            --prerelease --title "Native Android signed candidate ${GITHUB_RUN_NUMBER}" \
            --notes "Validation candidate only. Not approved for in-place production upgrade. Verify package identity, signing certificate and versionCode against the installed production app first."
