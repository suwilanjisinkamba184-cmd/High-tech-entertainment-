name: High-Tech Entertainment — Native Android Signed Candidate

on:
  push:
    branches: ["feature/**"]
    paths:
      - "flutter-ui/**"
      - "native-android/**"
      - ".github/workflows/native-android-signed-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "native-android/**"
      - "flutter-ui/**"
      - ".github/workflows/native-android-signed-candidate.yml"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub prerelease after signing (not a production release or OTA patch)"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hte-native-signed-candidate-${{ github.sha }}
  cancel-in-progress: true

jobs:
  signed-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter stable for embedded UI module
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Generate Flutter Android module integration
        working-directory: flutter-ui
        run: flutter pub get
      - name: Verify Flutter module bootstrap
        run: test -f flutter-ui/.android/include_flutter.groovy
      - name: Analyze Flutter application
        working-directory: flutter-ui
        run: flutter analyze
      - name: Run Flutter widget and integration tests
        working-directory: flutter-ui
        run: flutter test
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Install Android SDK 36 and Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || { echo "::error::Android sdkmanager not found."; exit 1; }
          # sdkmanager closes stdin after accepting all licenses; yes may then exit on SIGPIPE.
          # The following package installation is the authoritative license check.
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/zipalign"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt"
      - name: Build native release APK
        working-directory: native-android
        run: gradle --no-daemon :app:clean :app:testDebugUnitTest :app:assembleRelease
      - name: Verify APK identity, align, sign and verify certificate
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done

          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK="$(find native-android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Gradle did not produce a native release APK."; exit 1; }

          BADGING="$("$SDK_BUILD_TOOLS/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | grep -F "package: name='com.hightechentertainment.app'" >/dev/null || {
            echo "::error::Release APK package ID does not match production application ID."
            exit 1
          }
          printf '%s\n' "$BADGING" | grep -F "versionCode='30' versionName='3.1.0'" >/dev/null || {
            echo "::error::Unexpected native release version; expected 3.1.0 (30)."
            exit 1
          }

          mkdir -p "$RUNNER_TEMP/signing"
          trap 'rm -rf "$RUNNER_TEMP/signing"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/upload.p12"
          test -s "$RUNNER_TEMP/signing/upload.p12" || { echo "::error::Decoded keystore is empty."; exit 1; }

          ALIGNED_APK="$RUNNER_TEMP/native-aligned.apk"
          SIGNED_APK="$RUNNER_TEMP/High-Tech-Entertainment-native-signed.apk"
          "$SDK_BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$ALIGNED_APK"
          "$SDK_BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/signing/upload.p12" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$SIGNED_APK" "$ALIGNED_APK"

          VERIFY_OUTPUT="$("$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED_APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          APK_SHA256="$(sha256sum "$SIGNED_APK" | awk '{print $1}')"
          test "${#CERT_SHA256}" -eq 64 || { echo "::error::Could not extract signer SHA-256."; exit 1; }

          # Compare against the latest publicly published production APK, not just the keystore.
          # The latest official production release at this commit is v2.2.10-SU.
          PRODUCTION_APK="$RUNNER_TEMP/production-v2.2.10-SU.apk"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/suwilanjisinkamba184-cmd/High-tech-entertainment-/releases/download/v2.2.10-SU/High-Tech-Entertainment-v2.2.10-SU.apk" \
            --output "$PRODUCTION_APK"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$PRODUCTION_APK" | grep -F "package: name='com.hightechentertainment.app'" >/dev/null || {
            echo "::error::Reference production APK package ID does not match."
            exit 1
          }
          PRODUCTION_VERIFY="$("$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$PRODUCTION_APK")"
          PRODUCTION_CERT_SHA256="$(printf '%s\n' "$PRODUCTION_VERIFY" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$CERT_SHA256" != "$PRODUCTION_CERT_SHA256" ]; then
            echo "::error::Native candidate signer differs from the latest production APK. Install-over compatibility is not established."
            exit 1
          fi
          echo "PASS: native candidate signer exactly matches production v2.2.10-SU."

          FINAL_APK="$RUNNER_TEMP/High-Tech-Entertainment-native-v3.1.0.apk"
          mv "$SIGNED_APK" "$FINAL_APK"
          "$SDK_BUILD_TOOLS/zipalign" -c -p 4 "$FINAL_APK"
          printf '%s  %s\n' "$APK_SHA256" "$(basename "$FINAL_APK")" > "$RUNNER_TEMP/SHA256SUMS.txt"

          export CERT_SHA256 APK_SHA256 FINAL_APK PRODUCTION_CERT_SHA256
          python3 - <<'PY'
          import json, os
          manifest = {
              "packageName": "com.hightechentertainment.app",
              "versionName": "3.1.0",
              "versionCode": 30,
              "apkAssetName": os.path.basename(os.environ["FINAL_APK"]),
              "sha256": os.environ["APK_SHA256"],
              "certificateSha256": os.environ["CERT_SHA256"],
              "productionSignerMatch": os.environ["CERT_SHA256"] == os.environ["PRODUCTION_CERT_SHA256"],
              "comparedProductionRelease": "v2.2.10-SU",
              "channel": "candidate",
              "releaseNotes": "High-Tech Entertainment native Android 3.1.0 signed candidate."
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "manifest.json"), "w") as output:
              json.dump(manifest, output, separators=(",", ":"))
          PY
      - name: Upload signed native candidate and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: high-tech-entertainment-native-v3.1.0-signed-candidate
          path: |
            ${{ runner.temp }}/High-Tech-Entertainment-native-v3.1.0.apk
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish candidate prerelease only when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "native-v3.1.0-candidate-${GITHUB_RUN_NUMBER}" \
            "$RUNNER_TEMP/High-Tech-Entertainment-native-v3.1.0.apk" \
            "$RUNNER_TEMP/SHA256SUMS.txt" \
            "$RUNNER_TEMP/manifest.json" \
            --prerelease \
            --title "High-Tech Entertainment native 3.1.0 candidate ${GITHUB_RUN_NUMBER}" \
            --notes "Signed native Android 3.1.0 candidate. This prerelease is for installation and signer-compatibility verification. It is not a production release or OTA patch."
