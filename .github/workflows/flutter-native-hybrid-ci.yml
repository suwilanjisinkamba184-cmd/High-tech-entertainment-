name: High-Tech Entertainment — Flutter UI + Native Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - "flutter-ui/**"
      - "native-android/**"
      - ".github/workflows/flutter-native-hybrid-ci.yml"
  push:
    branches: [main]
    paths:
      - "flutter-ui/**"
      - "native-android/**"
      - ".github/workflows/flutter-native-hybrid-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hte-flutter-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hybrid-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: flutter-ui
        run: flutter pub get

      - name: Verify Flutter SDK and package graph
        working-directory: flutter-ui
        run: |
          flutter --version
          flutter pub outdated || true
          flutter analyze
          flutter test

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Build and test hybrid Android host
        working-directory: native-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload hybrid debug APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hte-hybrid-android-debug-${{ github.run_number }}
          path: |
            native-android/app/build/outputs/apk/debug/*.apk
            native-android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
