name: Sync official HTE YouTube uploads

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Upload playlist pages to scan (50 videos per page; max 50)"
        required: false
        default: "20"
        type: string

permissions:
  contents: read

concurrency:
  group: hte-official-youtube-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Validate sync configuration
        env:
          HTE_YOUTUBE_CHANNEL_ID: ${{ vars.HTE_YOUTUBE_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$HTE_YOUTUBE_CHANNEL_ID" ]; then
            echo "::notice::Set the repository variable HTE_YOUTUBE_CHANNEL_ID to the official channel URL, UC ID, or @handle. Sync skipped safely."
            exit 0
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ACCESS_TOKEN is missing from repository Actions secrets."
            exit 1
          fi
      - name: Sync public uploads into the shared Supabase catalogue
        if: ${{ vars.HTE_YOUTUBE_CHANNEL_ID != '' }}
        env:
          HTE_YOUTUBE_CHANNEL_ID: ${{ vars.HTE_YOUTUBE_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          MAX_PAGES: ${{ inputs.max_pages || '20' }}
        run: |
          payload=$(jq -n --arg channel "$HTE_YOUTUBE_CHANNEL_ID" --argjson maxPages "$MAX_PAGES" '{channel: $channel, maxPages: $maxPages}')
          curl --silent --show-error --fail-with-body --max-time 180 \
            -X POST "$SUPABASE_URL/functions/v1/sync-youtube-channel" \
            -H "Content-Type: application/json" \
            -H "x-supabase-access-token: $SUPABASE_ACCESS_TOKEN" \
            --data "$payload"
