name: High-Tech Entertainment — Native Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-ci.yml"
  push:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hte-native-android-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle version
        run: |
          gradle --version
          gradle --version | grep -q "Gradle 9.6"
      - name: Run unit tests and build debug APK
        working-directory: native-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload validation APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hte-native-android-debug-\${{ github.run_number }}
          path: |
            native-android/app/build/outputs/apk/debug/*.apk
            native-android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
