name: High-Tech Entertainment — Native Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - "native-android/**"
      - "flutter-ui/**"
      - ".github/workflows/native-android-ci.yml"
  push:
    branches: [main, "feature/**", "maintenance/**"]
    paths:
      - "native-android/**"
      - "flutter-ui/**"
      - ".github/workflows/native-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hte-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter stable for the embedded presentation module
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Generate Flutter add-to-app bootstrap when the module is present
        shell: bash
        run: |
          if [ -f flutter-ui/pubspec.yaml ]; then
            cd flutter-ui
            flutter --version
            flutter clean
            flutter pub get
          else
            echo "Flutter module is not part of this revision; building native baseline."
          fi
      - name: Verify or install stable Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK_ROOT/platforms/android-36" ] && [ -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            echo "Android API 36 and Build Tools 36.0.0 are already installed."
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android sdkmanager was not found and required SDK packages are missing."
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses
            "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.3"
      - name: Verify Gradle version
        run: |
          gradle --version
          gradle --version | grep -q "Gradle 8.14.3"
      - name: Run unit tests and build debug APK
        working-directory: native-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Verify startup MP3 is packaged in the native APK
        working-directory: native-android
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::Native debug APK was not produced."; exit 1; }
          if ! unzip -l "$APK" | grep -Eq 'res/raw/high_tech_startup[^/]*\.mp3'; then
            echo "::error::Bundled startup MP3 is missing from the native APK."
            unzip -l "$APK" | grep 'res/raw/' || true
            exit 1
          fi
          echo "PASS: startup MP3 is packaged inside the APK."

          # Guard against accidentally publishing the legacy native shell again.
          if ! unzip -l "$APK" | grep -Fq 'assets/flutter_assets/assets/high-tech-logo.svg'; then
            echo "::error::Flutter logo asset is missing; this APK does not contain the expected Flutter presentation bundle."
            exit 1
          fi
          BADGING="$("$SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\\n' "$BADGING" | grep -F "launchable-activity: name='com.hightechentertainment.app.FlutterHostActivity'" >/dev/null || {
            echo "::error::FlutterHostActivity is not the APK's launcher activity."
            printf '%s\\n' "$BADGING" | grep 'launchable-activity:' || true
            exit 1
          }
          echo "PASS: Flutter UI asset is bundled and FlutterHostActivity is the launcher."
      - name: Upload validation APK and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hte-native-android-debug-${{ github.run_number }}
          path: |
            native-android/app/build/outputs/apk/debug/*.apk
            native-android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
