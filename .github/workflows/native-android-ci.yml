name: High-Tech Entertainment — Native Android CI

on:
  pull_request:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-ci.yml"
  push:
    branches: [main]
    paths:
      - "native-android/**"
      - ".github/workflows/native-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hte-native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify or install Android SDK 37
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK_ROOT/platforms/android-37" ] && [ -d "$SDK_ROOT/build-tools/37.0.0" ]; then
            echo "Android API 37 and Build Tools 37.0.0 are already installed."
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
            if [ -z "$SDKMANAGER" ]; then
              echo "::error::Android sdkmanager was not found and required SDK packages are missing."
              exit 1
            fi
            yes | "$SDKMANAGER" --licenses || true
            "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0"
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Verify Gradle version
        run: |
          gradle --version
          gradle --version | grep -q "Gradle 9.8"
      - name: Run unit tests and build debug APK
        working-directory: native-android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload validation APK and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hte-native-android-debug-${{ github.run_number }}
          path: |
            native-android/app/build/outputs/apk/debug/*.apk
            native-android/app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14
