name: Deploy High-Tech Entertainment to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'account/**'
      - 'admin/**'
      - 'supabase-config.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'account-deletion.html'
      - 'privacy-policy.html'
      - 'high-tech-logo.svg'
      - '.github/workflows/deploy-netlify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hte-netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble public website
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R assets admin account _site/
          cp index.html supabase-config.js robots.txt sitemap.xml account-deletion.html privacy-policy.html high-tech-logo.svg _site/
          cp google*.html _site/ 2>/dev/null || true
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/supabase-config.js
          test -s _site/robots.txt
          test -s _site/sitemap.xml

      - name: Publish production site to Netlify
        if: env.NETLIFY_AUTH_TOKEN != ''
        env:
          NETLIFY_SITE_ID: 6bb79ec5-80a6-4973-b429-31ff4fbf958a
        run: npx --yes netlify-cli@latest deploy --prod --dir _site --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"

      - name: Report missing Netlify credential
        if: env.NETLIFY_AUTH_TOKEN == ''
        run: |
          echo "::warning::Netlify deploy skipped. Add NETLIFY_AUTH_TOKEN in GitHub repository Actions secrets to enable automatic production publishing."
